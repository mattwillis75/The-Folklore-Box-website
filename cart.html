<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | The Folklore Box</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;600&family=Spectral:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS & PayPal SDKs -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){ emailjs.init({ publicKey: "qI6ltlwzFXECV29P8", }); })();
    </script>
    <script src="https://www.paypal.com/sdk/js?client-id=BAAyFEECFHCgIYSVAcx3GUqT0FI1rHhhU_mwYJxRf6ngeAPN3zYdx3W4a1tCIEHivTFLxU7oFEeDD1NIIs&currency=GBP&locale=en_GB"></script>

    <style>
        :root { --bg-color: #000000; --text-color: #ffffff; --accent-red: #cc0000; --header-bg: rgba(0, 0, 0, 0.85); }
        body { font-family: 'Lato', sans-serif; font-weight: 300; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        h1, h2 { font-family: 'Spectral', serif; font-weight: 400; color: #ffffff; }

        /* Header (Standardized) */
        header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 3rem; background: var(--header-bg); border-bottom: 1px solid #333333; z-index: 1000; box-sizing: border-box; backdrop-filter: blur(8px); }
        .logo img { max-width: 180px; height: auto; }
        nav ul { list-style: none; display: flex; align-items: center; gap: 2rem; margin: 0; padding: 0; }
        nav a { text-decoration: none; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; transition: color 0.3s; }
        nav a:hover { color: var(--accent-red); }
        #cart-toggle { color: var(--accent-red); border: 1px solid var(--accent-red); padding: 0.5rem 1rem; border-radius: 3px; }

        /* Cart Page Specific Styles */
        main { padding-top: 120px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 4rem; }
        .cart-container { width: 100%; max-width: 800px; background: #0a0a0a; border: 1px solid #222; border-radius: 4px; padding: 2rem 3rem; box-sizing: border-box; }
        
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; }
        .cart-header h1 { margin: 0; font-size: 2.5rem; }
        .continue-shopping { color: #888; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .continue-shopping:hover { color: var(--accent-red); }

        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 0; border-bottom: 1px solid #222; gap: 1rem; }
        .cart-item-title { flex-grow: 1; font-weight: 600; font-size: 1.1rem; line-height: 1.3; }
        .cart-qty-controls { display: flex; align-items: center; gap: 1rem; background: #111; padding: 0.4rem 0.8rem; border-radius: 3px; border: 1px solid #333; }
        .cart-qty-controls button { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .cart-qty-controls button:hover { color: var(--accent-red); }
        .cart-item-total { font-weight: bold; min-width: 80px; text-align: right; font-size: 1.1rem; }
        .remove-btn { background: none; border: none; color: #555; cursor: pointer; font-size: 1.8rem; transition: 0.2s; }
        .remove-btn:hover { color: var(--accent-red); }

        .cart-footer { margin-top: 2rem; }
        .cart-shipping-selector { margin-bottom: 1.5rem; border-bottom: 1px solid #222; padding-bottom: 1.5rem; }
        .cart-shipping-selector label { display: block; color: #aaa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
        .cart-shipping-selector select { width: 100%; padding: 1rem; background: #111; color: #fff; border: 1px solid #333; border-radius: 3px; cursor: pointer; font-family: 'Lato', sans-serif; font-size: 1rem; }
        
        .cart-breakdown { margin-bottom: 1.5rem; color: #aaa; font-size: 1.1rem; }
        .cart-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .cart-total { font-size: 2rem; text-align: right; margin-bottom: 2rem; font-family: 'Spectral', serif; color: var(--accent-red); border-top: 1px solid #333; padding-top: 1.5rem; }

        .cart-warning { background: rgba(204, 0, 0, 0.1); border: 1px solid var(--accent-red); color: var(--accent-red); font-weight: bold; text-align: center; padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.95rem; display: none; }
        .paypal-disabled { pointer-events: none; opacity: 0.4; filter: grayscale(100%); }

        @media (max-width: 600px) {
            .cart-container { padding: 1.5rem; border-left: none; border-right: none; border-radius: 0; }
            header { padding: 1rem 1.5rem; }
            .cart-header h1 { font-size: 2rem; }
            .cart-item { flex-direction: column; align-items: flex-start; }
            .cart-qty-controls { width: 100%; justify-content: space-between; margin-top: 1rem; box-sizing: border-box; }
            .cart-item-total { width: 100%; text-align: left; margin-top: 0.5rem; }
            .remove-btn { align-self: flex-end; margin-top: -30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><a href="index.html"><img src="./The-folklore-box-logo.png" alt="The Folklore Box"></a></div>
        <nav>
            <ul>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="wholesale.html">Wholesale</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="cart-container">
            <div class="cart-header">
                <h1>Your Cart</h1>
                <a href="shop.html" class="continue-shopping">Continue Shopping &rarr;</a>
            </div>
            
            <div id="cart-items"></div>
            
            <div class="cart-footer">
                <div class="cart-warning" id="cart-warning">
                    Minimum wholesale spend is £75.00 before postage. Add more items to unlock checkout.
                </div>

                <div class="cart-shipping-selector">
                    <label for="cart-destination">Deliver to:</label>
                    <select id="cart-destination">
                        <option value="uk">United Kingdom</option>
                        <option value="int">International</option>
                    </select>
                </div>
                
                <div class="cart-breakdown">
                    <div class="cart-row"><span>Items:</span><span id="cart-subtotal">£0.00</span></div>
                    <div class="cart-row"><span>Postage:</span><span id="cart-shipping-cost">£0.00</span></div>
                </div>
                
                <div class="cart-total" id="cart-total">Total: £0.00</div>
                <div id="paypal-button-container"></div>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const isWholesale = sessionStorage.getItem('wholesaleAuthenticated') === 'true';
            const cartKey = 'folkloreCart'; // Unified Single Cart
            
            // Clean up any old ghost wholesale cart if they somehow have one stuck in their browser
            localStorage.removeItem('folkloreWholesaleCart');

            let cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            cart.forEach(item => { if(!item.quantity) item.quantity = 1; });

            const cartItemsContainer = document.getElementById('cart-items');
            const destSelect = document.getElementById('cart-destination');
            const cartWarning = document.getElementById('cart-warning');
            const paypalContainer = document.getElementById('paypal-button-container');

            // Fetch Postal Rates
            let postalRates = {};
            try {
                const postalResponse = await fetch('postal.txt', { cache: 'no-store' });
                const postalText = await postalResponse.text();
                postalText.split('---').forEach(block => {
                    if(!block.trim()) return;
                    let currentClass = ""; let rates = {};
                    block.trim().split('\n').forEach(line => {
                        const sepIndex = line.indexOf(':');
                        if(sepIndex > -1) {
                            const key = line.slice(0, sepIndex).trim().toLowerCase();
                            const value = line.slice(sepIndex + 1).trim();
                            if(key === 'class') currentClass = value;
                            else if(key === 'uk base') rates.ukBase = parseFloat(value);
                            else if(key === 'uk additional') rates.ukAdd = parseFloat(value);
                            else if(key === 'int base') rates.intBase = parseFloat(value);
                            else if(key === 'int additional') rates.intAdd = parseFloat(value);
                        }
                    });
                    if(currentClass) postalRates[currentClass] = rates;
                });
            } catch(e) { console.error("Could not load postal rates."); }

            window.updateQuantity = function(index, delta) {
                cart[index].quantity += delta;
                if (cart[index].quantity <= 0) cart.splice(index, 1);
                localStorage.setItem(cartKey, JSON.stringify(cart));
                updateCartUI();
            };

            window.removeFromCart = function(index) { 
                cart.splice(index, 1); 
                localStorage.setItem(cartKey, JSON.stringify(cart)); 
                updateCartUI(); 
            };

            function updateCartUI() {
                cartItemsContainer.innerHTML = '';
                let itemsTotal = 0; let shippingTotal = 0; let finalTotal = 0;
                
                if (cart.length === 0) {
                    cartItemsContainer.innerHTML = `<p style="color: #777; font-style: italic; text-align: center; padding: 2rem 0;">Your cart is currently empty.</p>`;
                    document.getElementById('cart-subtotal').textContent = `£0.00`;
                    document.getElementById('cart-shipping-cost').textContent = `£0.00`;
                    document.getElementById('cart-total').textContent = `Total: £0.00`;
                    paypalContainer.style.display = 'none';
                    cartWarning.style.display = 'none';
                    return;
                } else {
                    paypalContainer.style.display = 'block';
                }

                const dest = destSelect.value;
                let maxBase = 0; let maxBaseItem = null;

                cart.forEach((item, index) => {
                    const qty = item.quantity || 1;
                    
                    // DYNAMIC DISCOUNT: Calculates 60% if Wholesale Mode is active, otherwise standard price
                    const displayPrice = isWholesale ? Math.round(item.price * 0.60 * 100) / 100 : item.price;
                    const itemTotalCost = displayPrice * qty;
                    itemsTotal += itemTotalCost;

                    const sizeText = item.size ? `<br><span style="font-size:0.85rem; color:#888;">Size: ${item.size}</span>` : '';

                    cartItemsContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-title">
                                ${item.title} ${sizeText} <br>
                                <span style="font-size:0.85rem; color:#888; font-weight:normal;">£${displayPrice.toFixed(2)} each</span>
                            </div>
                            <div class="cart-qty-controls">
                                <button onclick="updateQuantity(${index}, -1)">-</button>
                                <span style="font-weight: bold;">${qty}</span>
                                <button onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                            <div class="cart-item-total">£${itemTotalCost.toFixed(2)}</div>
                            <button class="remove-btn" onclick="removeFromCart(${index})" title="Remove item">&times;</button>
                        </div>
                    `;
                    
                    const rates = postalRates[item.postalClass];
                    if(rates) {
                        const baseRate = dest === 'uk' ? rates.ukBase : rates.intBase;
                        if(baseRate > maxBase) { maxBase = baseRate; maxBaseItem = item; }
                    }
                });

                let baseRateApplied = false;
                cart.forEach((item) => {
                    const rates = postalRates[item.postalClass];
                    if(rates) {
                        const qty = item.quantity || 1;
                        const baseRate = dest === 'uk' ? rates.ukBase : rates.intBase;
                        const addRate = dest === 'uk' ? rates.ukAdd : rates.intAdd;

                        if (item === maxBaseItem && !baseRateApplied) {
                            shippingTotal += baseRate + (addRate * (qty - 1));
                            baseRateApplied = true;
                        } else {
                            shippingTotal += addRate * qty;
                        }
                    }
                });

                finalTotal = itemsTotal + shippingTotal;

                document.getElementById('cart-subtotal').textContent = `£${itemsTotal.toFixed(2)}`;
                document.getElementById('cart-shipping-cost').textContent = `£${shippingTotal.toFixed(2)}`;
                document.getElementById('cart-total').textContent = `Total: £${finalTotal.toFixed(2)}`;

                // Wholesale Validation
                if (isWholesale) {
                    if (itemsTotal >= 75) {
                        cartWarning.style.display = 'none';
                        paypalContainer.classList.remove('paypal-disabled');
                    } else {
                        cartWarning.style.display = 'block';
                        paypalContainer.classList.add('paypal-disabled');
                    }
                }
            }

            destSelect.addEventListener('change', updateCartUI);
            updateCartUI();

            // PayPal SDK Initialization
            try {
                paypal.Buttons({
                    style: { color: 'gold', shape: 'rect', label: 'checkout', layout: 'vertical' },
                    
                    onClick: function() {
                        setTimeout(() => {
                            window.scrollTo({ 
                                top: document.body.scrollHeight, 
                                behavior: 'smooth' 
                            });
                        }, 500); 
                    },

                    createOrder: function(data, actions) {
                        let itemsTotal = 0; let shippingTotal = 0; let maxBase = 0; let maxBaseItem = null;
                        const dest = destSelect.value;
                        
                        cart.forEach(item => {
                            const qty = item.quantity || 1;
                            const displayPrice = isWholesale ? Math.round(item.price * 0.60 * 100) / 100 : item.price;
                            itemsTotal += displayPrice * qty;
                            const rates = postalRates[item.postalClass];
                            if(rates) {
                                const baseRate = dest === 'uk' ? rates.ukBase : rates.intBase;
                                if(baseRate > maxBase) { maxBase = baseRate; maxBaseItem = item; }
                            }
                        });

                        let baseRateApplied = false;
                        cart.forEach(item => {
                            const rates = postalRates[item.postalClass];
                            if(rates) {
                                const qty = item.quantity || 1;
                                const baseRate = dest === 'uk' ? rates.ukBase : rates.intBase;
                                const addRate = dest === 'uk' ? rates.ukAdd : rates.intAdd;
                                if (item === maxBaseItem && !baseRateApplied) {
                                    shippingTotal += baseRate + (addRate * (qty - 1));
                                    baseRateApplied = true;
                                } else {
                                    shippingTotal += addRate * qty;
                                }
                            }
                        });
                        
                        const paypalItems = cart.map(item => {
                            const displayPrice = isWholesale ? Math.round(item.price * 0.60 * 100) / 100 : item.price;
                            return {
                                name: item.title + (item.size ? ` (Size: ${item.size})` : ''),
                                unit_amount: { currency_code: 'GBP', value: displayPrice.toFixed(2) },
                                quantity: (item.quantity || 1).toString()
                            };
                        });
                        
                        if (isWholesale && itemsTotal < 75) { alert("Minimum wholesale spend of £75 not met."); return; }

                        let finalTotal = itemsTotal + shippingTotal;
                        if (finalTotal <= 0) return;

                        return actions.order.create({
                            purchase_units: [{ 
                                amount: { 
                                    currency_code: 'GBP', 
                                    value: finalTotal.toFixed(2),
                                    breakdown: { item_total: { currency_code: 'GBP', value: itemsTotal.toFixed(2) }, shipping: { currency_code: 'GBP', value: shippingTotal.toFixed(2) } }
                                },
                                items: paypalItems
                            }],
                            application_context: { shipping_preference: 'GET_FROM_FILE' }
                        });
                    },
                    onApprove: function(data, actions) {
                        return actions.order.capture().then(function(details) {
                            try {
                                let orderBreakdown = "";
                                let subtotal = 0;
                                cart.forEach(item => {
                                    const displayPrice = isWholesale ? Math.round(item.price * 0.60 * 100) / 100 : item.price;
                                    const itemTotal = displayPrice * (item.quantity || 1);
                                    subtotal += itemTotal;
                                    const sizeStr = item.size ? ` (Size: ${item.size})` : '';
                                    orderBreakdown += `${item.quantity || 1}x ${item.title}${sizeStr} - £${itemTotal.toFixed(2)}\n`;
                                });

                                const shippingCostEl = document.getElementById('cart-shipping-cost');
                                const totalPaidEl = document.getElementById('cart-total');
                                const shippingCostText = shippingCostEl ? shippingCostEl.textContent : '£0.00';
                                const totalPaidText = totalPaidEl ? totalPaidEl.textContent.replace('Total: ', '') : '£0.00';

                                const templateParams = {
                                    to_name: details.payer.name.given_name,
                                    to_email: details.payer.email_address,
                                    order_details: orderBreakdown,
                                    shipping_cost: shippingCostText,
                                    total_paid: totalPaidText
                                };

                                if (typeof emailjs !== 'undefined') emailjs.send('service_zmm27cb', 'template_ld7uqbh', templateParams).catch(err => console.error('Email failed...', err));

                                // GOOGLE SHEETS EXPORT
                                let shippingAddress = "No address provided";
                                let flatAddress = "No address provided";
                                let addr = {};
                                let shipName = details.payer.name.given_name + ' ' + (details.payer.name.surname || '');

                                if (details.purchase_units && details.purchase_units[0].shipping && details.purchase_units[0].shipping.address) {
                                    addr = details.purchase_units[0].shipping.address;
                                    shipName = details.purchase_units[0].shipping.name ? details.purchase_units[0].shipping.name.full_name : shipName;
                                    
                                    flatAddress = [
                                        shipName, 
                                        addr.address_line_1, 
                                        addr.address_line_2, 
                                        addr.admin_area_2, 
                                        addr.admin_area_1, 
                                        addr.postal_code, 
                                        addr.country_code
                                    ].filter(Boolean).join(', ');
                                }

                                const sheetData = {
                                    name: shipName,
                                    email: details.payer.email_address,
                                    address_string: flatAddress,
                                    addr_line_1: addr.address_line_1 || "N/A",
                                    addr_line_2: addr.address_line_2 || "",
                                    city: addr.admin_area_2 || "",
                                    county: addr.admin_area_1 || "",
                                    postcode: addr.postal_code || "",
                                    country_code: addr.country_code || "GBR",
                                    order_details: orderBreakdown.trim(),
                                    subtotal: '£' + subtotal.toFixed(2),
                                    shipping_cost: shippingCostText,
                                    discount: isWholesale ? 'Wholesale Applied' : '£0.00',
                                    total_paid: totalPaidText,
                                    order_id: details.id
                                };

                                const scriptURL = 'https://script.google.com/macros/s/AKfycbwaaQwZh7OD_ZL6kuEeehNUBjxVwfAdQfNrPd8yMajBVRUQKfJxi-H97TWeODqQ-yfN/exec';
                                
                                fetch(scriptURL, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                    body: JSON.stringify(sheetData)
                                }).then(response => {
                                    if(!response.ok) throw new Error("HTTP error " + response.status);
                                }).catch(error => console.error('Error saving order payload:', error));

                            } catch (err) { console.error('Checkout Data Error:', err); }

                            alert('Payment successful! We have received your order, ' + details.payer.name.given_name + ', and an email confirmation will be sent to you shortly.');
                            
                            cart = []; 
                            localStorage.setItem(cartKey, JSON.stringify(cart)); 
                            window.location.href = 'shop.html';
                        });
                    },
                }).render('#paypal-button-container');
            } catch (error) { console.warn("PayPal SDK could not initialize.", error); }
        });
    </script>
</body>
</html>
