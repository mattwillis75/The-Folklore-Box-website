<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | The Folklore Box</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;600&family=Spectral:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Colors & Typography */
        :root {
            --bg-color: #000000;
            --secondary-bg: #0a0a0a;
            --border-color: #333333;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #cc0000;
            --font-headings: 'Spectral', serif;
            --font-body: 'Lato', sans-serif;
            --transition-speed: 0.3s;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Navigation - Restored to the sticky blurred design */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 500;
        }
        
        header h1 {
            font-family: var(--font-headings);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cart-toggle-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 300; /* Lighter weight */
            letter-spacing: 1px;
            border-radius: 3px;
            transition: border-color var(--transition-speed);
        }

        .cart-toggle-btn:hover {
            border-color: var(--accent-red);
        }

        /* Shop Layout */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 20px;
            transition: all var(--transition-speed);
        }

        .filter-btn.active, .filter-btn:hover {
            border-color: var(--accent-red);
            color: var(--text-light);
        }

        /* Fits 4 items comfortably */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 30px;
        }

        /* Product Cards */
        .product-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            transition: transform var(--transition-speed);
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #555;
        }

        .product-card a {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-image {
            width: 100%;
            height: 280px;
            overflow: hidden;
            background: #111;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .product-title {
            font-family: var(--font-headings);
            font-size: 1.25rem;
            margin: 0 0 10px 0;
        }

        .product-price {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .add-cart-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--accent-red);
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 300; /* Lighter weight */
            letter-spacing: 1px;
            transition: background var(--transition-speed);
            margin-top: auto;
        }

        .add-cart-btn:hover:not(:disabled) {
            background: var(--accent-red);
        }

        /* Smart Cart Side Panel */
        .cart-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s;
        }

        .cart-panel {
            position: fixed;
            top: 0; right: -400px;
            width: 100%; max-width: 400px;
            height: 100vh;
            background: var(--secondary-bg);
            border-left: 1px solid var(--border-color);
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .cart-overlay.active { opacity: 1; visibility: visible; }
        .cart-panel.active { right: 0; }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h2 { margin: 0; font-family: var(--font-headings); }

        .close-cart-btn {
            background: none; border: none; color: var(--text-light);
            font-size: 1.5rem; cursor: pointer;
        }

        .cart-items-container {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-details { flex-grow: 1; }
        .cart-item-title { margin: 0 0 5px 0; font-weight: 600; }
        .cart-item-meta { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 5px 0; }
        
        .cart-qty-controls {
            display: flex; align-items: center; gap: 10px;
        }
        
        .qty-btn {
            background: #222; border: none; color: #fff;
            width: 25px; height: 25px; cursor: pointer; border-radius: 3px;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-color);
        }

        .cart-total-row {
            display: flex; justify-content: space-between;
            font-size: 1.2rem; font-weight: 600; margin-bottom: 20px;
        }

        .checkout-btn {
            width: 100%; padding: 15px; background: var(--accent-red);
            color: #fff; border: none; border-radius: 3px;
            text-transform: uppercase; font-weight: 300; /* Lighter weight */
            letter-spacing: 1px; cursor: pointer; font-size: 1rem;
        }

        /* Custom Stock Alert Modal */
        .stock-alert-overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.8); z-index: 3000; 
            display: none; align-items: center; justify-content: center; 
            backdrop-filter: blur(5px); 
        }
        .stock-alert-box { 
            background: #0a0a0a; border: 1px solid var(--accent-red); 
            padding: 2.5rem; border-radius: 4px; max-width: 400px; 
            width: 90%; text-align: center; color: #fff; 
            box-shadow: 0 10px 30px rgba(204,0,0,0.15); 
        }
        .stock-alert-box p { margin-bottom: 2rem; font-size: 1.1rem; }
        .stock-alert-btn { 
            background: var(--accent-red); color: #fff; border: none; 
            padding: 1rem 2rem; text-transform: uppercase; font-weight: 300; 
            letter-spacing: 1px; cursor: pointer; border-radius: 3px; 
            transition: background 0.3s ease; width: 100%; 
        }
        .stock-alert-btn:hover { background: #e60000; }
    </style>
</head>
<body>

    <header>
        <h1>The Folklore Box</h1>
        <button class="cart-toggle-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
    </header>

    <div class="container">
        <!-- Category Filters -->
        <div class="filter-bar" id="filter-bar">
            <!-- Populated dynamically -->
        </div>

        <!-- Dynamic Shop Grid -->
        <div class="shop-grid" id="shop-grid">
            <!-- Products injected here by JS -->
        </div>
    </div>

    <!-- Smart Cart Panel -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart-btn" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items-container" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">£0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Custom Stock Alert Modal -->
    <div id="stock-alert" class="stock-alert-overlay">
        <div class="stock-alert-box">
            <h2 style="margin-top: 0; color: var(--accent-red);">Stock Limit Reached</h2>
            <p id="stock-alert-msg"></p>
            <button class="stock-alert-btn" onclick="document.getElementById('stock-alert').style.display='none'">Understood</button>
        </div>
    </div>

    <script>
        const shopGrid = document.getElementById('shop-grid');
        const filterBar = document.getElementById('filter-bar');
        let products = [];
        let filteredProducts = [];
        let availableCategories = new Set();
        
        const cartKey = 'folklore_cart';
        let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

        // CACHE BUSTER ADDED HERE
        fetch('products.txt?v=' + new Date().getTime(), { cache: 'no-store' })
            .then(response => response.text())
            .then(text => {
                const blocks = text.split(/---\r?\n/);
                blocks.forEach(block => {
                    if (block.trim() === '') return;
                    const lines = block.split('\n');
                    
                    let product = { 
                        basePrice: 0, sections: '', 
                        stock: 10, stockS: 10, stockM: 10, stockL: 10, stockXL: 10, stockXXL: 10 
                    }; 
                    
                    lines.forEach(line => {
                        const colonIdx = line.indexOf(':');
                        if (colonIdx > -1) {
                            const key = line.substring(0, colonIdx).trim().toLowerCase();
                            const value = line.substring(colonIdx + 1).trim();
                            if (key === 'title') product.title = value;
                            else if (key === 'main image') product.mainImage = value;
                            else if (key === 'sections') {
                                product.sections = value;
                                value.split(',').forEach(sec => {
                                    if(sec.trim()) availableCategories.add(sec.trim());
                                });
                            }
                            else if (key === 'postal class') product.postalClass = value;
                            else if (key === 'item cost') product.basePrice = parseFloat(value.replace(/[^0-9.]/g, '')) || 0;
                            
                            // Stock parsing
                            else if (key === 'stock') product.stock = isNaN(parseInt(value)) ? 10 : parseInt(value);
                            else if (key === 'stock s') product.stockS = isNaN(parseInt(value)) ? 10 : parseInt(value);
                            else if (key === 'stock m') product.stockM = isNaN(parseInt(value)) ? 10 : parseInt(value);
                            else if (key === 'stock l') product.stockL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                            else if (key === 'stock xl') product.stockXL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                            else if (key === 'stock xxl') product.stockXXL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                        }
                    });

                    // Generate rock-solid unique ID based on the Title 
                    if (product.title) {
                        product.id = 'prod-' + product.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                        products.push(product);
                    }
                });
                
                filteredProducts = [...products];
                buildFilters();
                renderGrid();
                updateCartUI();
            })
            .catch(err => {
                console.error("Error loading products:", err);
                shopGrid.innerHTML = "<p>Unable to load shop inventory at this time.</p>";
            });

        // 2. Build Dynamic Filters
        function buildFilters() {
            filterBar.innerHTML = `<button class="filter-btn active" onclick="filterCategory('All')">All Items</button>`;
            Array.from(availableCategories).sort().forEach(category => {
                filterBar.innerHTML += `<button class="filter-btn" onclick="filterCategory('${category.replace(/'/g, "\\'")}')">${category}</button>`;
            });
        }

        // 3. Render Shop Grid
        function renderGrid() {
            shopGrid.innerHTML = '';
            filteredProducts.forEach(product => {
                let actionButton = '';
                
                // T-SHIRTS (Link to product page for size selection)
                if (product.sections && product.sections.toLowerCase().includes('t-shirts')) {
                    actionButton = `<button class="add-cart-btn" onclick="event.preventDefault(); event.stopPropagation(); window.location.href='product.html?id=${encodeURIComponent(product.id)}'">Add to Cart</button>`;
                } 
                // STANDARD ITEMS - OUT OF STOCK
                else if (product.stock <= 0) {
                    actionButton = `<button class="add-cart-btn" disabled style="background:#222; color:#777; border-color:#333; cursor:not-allowed;">Out of Stock</button>`;
                } 
                // STANDARD ITEMS - IN STOCK
                else {
                    actionButton = `<button class="add-cart-btn" onclick="event.preventDefault(); event.stopPropagation(); addToSmartCart('${product.id}', '${product.title.replace(/'/g, "\\'")}', ${product.basePrice}, '${product.postalClass}', null)">Add to Cart</button>`;
                }

                shopGrid.innerHTML += `
                    <div class="product-card">
                        <a href="product.html?id=${encodeURIComponent(product.id)}">
                            <div class="product-image">
                                <img src="${product.mainImage || 'placeholder.jpg'}" alt="${product.title.replace(/"/g, '&quot;')}">
                            </div>
                            <div class="product-info">
                                <div>
                                    <h3 class="product-title">${product.title}</h3>
                                </div>
                                <div>
                                    <p class="product-price">£${product.basePrice.toFixed(2)}</p>
                                    ${actionButton}
                                </div>
                            </div>
                        </a>
                    </div>
                `;
            });
        }

        // 4. Category Filtering Logic
        window.filterCategory = function(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (category === 'All') {
                filteredProducts = [...products];
            } else {
                filteredProducts = products.filter(p => p.sections && p.sections.split(',').map(s=>s.trim()).includes(category));
            }
            renderGrid();
        };

        // 5. Cart Logic & Size-Specific Stock Validation
        window.addToSmartCart = function(id, title, price, postalClass, size = null) {
            const productData = products.find(p => p.id === id);
            
            let maxStock = 10;
            if (productData) {
                if (size === 'S') maxStock = productData.stockS;
                else if (size === 'M') maxStock = productData.stockM;
                else if (size === 'L') maxStock = productData.stockL;
                else if (size === 'XL') maxStock = productData.stockXL;
                else if (size === 'XXL') maxStock = productData.stockXXL;
                else maxStock = productData.stock;
            }
            
            const cartItemId = size ? `${id}-${size}` : id;
            let existingItem = cart.find(item => (item.cartItemId || item.id) === cartItemId);
            let currentQty = existingItem ? existingItem.quantity : 0;

            if (currentQty + 1 > maxStock) {
                document.getElementById('stock-alert-msg').textContent = `Apologies. We only have ${maxStock} of this item in stock.`;
                document.getElementById('stock-alert').style.display = 'flex';
                return; 
            }

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, cartItemId, title, price, postalClass, size, quantity: 1 });
            }
            
            saveAndRefreshCart();
            openCart();
        };

        window.updateQuantity = function(index, delta) {
            if (delta > 0) {
                const item = cart[index];
                const productData = products.find(p => p.id === item.id);
                
                let maxStock = 10;
                if (productData) {
                    if (item.size === 'S') maxStock = productData.stockS;
                    else if (item.size === 'M') maxStock = productData.stockM;
                    else if (item.size === 'L') maxStock = productData.stockL;
                    else if (item.size === 'XL') maxStock = productData.stockXL;
                    else if (item.size === 'XXL') maxStock = productData.stockXXL;
                    else maxStock = productData.stock;
                }
                
                if (item.quantity + delta > maxStock) {
                    document.getElementById('stock-alert-msg').textContent = `Apologies. We only have ${maxStock} of this item in stock.`;
                    document.getElementById('stock-alert').style.display = 'flex';
                    return;
                }
            }

            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            saveAndRefreshCart();
        };

        function saveAndRefreshCart() {
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartUI();
        }

        // 6. Cart UI Updates
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const cartCountLabel = document.getElementById('cart-count');
            const cartSubtotalLabel = document.getElementById('cart-subtotal');
            
            cartContainer.innerHTML = '';
            let totalItems = 0;
            let subtotal = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px;">Your cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    totalItems += item.quantity;
                    subtotal += item.price * item.quantity;
                    
                    const sizeLabel = item.size ? `<p class="cart-item-meta">Size: ${item.size}</p>` : '';
                    
                    cartContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <h4 class="cart-item-title">${item.title}</h4>
                                ${sizeLabel}
                                <p class="cart-item-meta">£${item.price.toFixed(2)}</p>
                            </div>
                            <div class="cart-qty-controls">
                                <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            cartCountLabel.innerText = totalItems;
            cartSubtotalLabel.innerText = `£${subtotal.toFixed(2)}`;
        }

        // 7. Side Panel Toggles
        window.openCart = function() {
            document.getElementById('cart-overlay').classList.add('active');
            document.getElementById('cart-panel').classList.add('active');
        };

        window.closeCart = function() {
            document.getElementById('cart-overlay').classList.remove('active');
            document.getElementById('cart-panel').classList.remove('active');
        };

        // 8. Checkout Stub 
        window.checkout = function() {
            if(cart.length === 0) return;
            alert('Proceeding to checkout...'); 
        };
    </script>
</body>
</html>
