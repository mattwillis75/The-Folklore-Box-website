<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | The Folklore Box</title>
    <meta name="description" content="Shop original British folklore artwork, prints, apparel, and wooden wares by The Folklore Box.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;600&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-red: #cc0000;
        }

        body {
            font-family: 'Lato', sans-serif;
            font-weight: 300;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
            background-attachment: fixed;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            border-bottom: 1px solid #333;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 2rem;
            transition: color 0.3s ease;
        }

        nav a:hover, nav a.active {
            color: var(--accent-red);
        }

        /* Holding Message */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .message-container {
            max-width: 600px;
        }

        h1 {
            font-family: 'Spectral', serif;
            font-size: 3.5rem;
            font-weight: 400;
            margin: 0 0 1rem 0;
            letter-spacing: 1px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #dddddd;
            margin: 0 auto 2rem auto;
        }

        .divider {
            width: 50px;
            height: 2px;
            background-color: var(--accent-red);
            margin: 0 auto 2rem auto;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            border-top: 1px solid #333;
            font-size: 0.9rem;
            color: #888;
        }

        .social-links {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .social-links a {
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: color 0.3s ease, transform 0.3s ease;
            display: inline-block;
        }

        .social-links a:hover {
            color: var(--accent-red);
            transform: translateY(-2px);
        }

        /* Animation */
        .fade-in {
            animation: fadeIn 1.5s ease-in forwards;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1.5rem;
            }
            nav a {
                margin: 0 1rem;
            }
            h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header class="fade-in">
        <div class="logo-container">
            <a href="index.html">
                <img src="./The-folklore-box-logo.png" alt="The Folklore Box Logo">
            </a>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="zine.html">Shuck Zine</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main class="fade-in">
        <div class="message-container">
            <h1>Stocking the shelves...</h1>
            <div class="divider"></div>
            <p>The Folklore Box elves are currently stocking the shelves. Check back soon to browse a selection of original prints, T-Shirts, totes, and wooden decorations.</p>
        </div>
    </main>

    <footer class="fade-in">
        <div class="social-links">
            <a href="https://instagram.com/the_folklore_box" target="_blank">Instagram</a>
            <a href="https://facebook.com/thefolklorebox" target="_blank">Facebook</a>
        </div>
        <p>&copy; 2026 The Folklore Box. All rights reserved.</p>
    </footer>

</body>
</html>
