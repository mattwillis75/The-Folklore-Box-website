<!-- Slide-Out Shopping Cart -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <h2 id="cart-title">Your Cart</h2>
        <button class="close-cart-btn" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items-container" id="cart-items"></div>
    <div class="cart-footer">
        <div class="cart-warning" id="cart-warning">
            Minimum wholesale spend is £75.00 before postage.
        </div>
        
        <div class="discount-container" id="discount-container">
            <input type="text" id="discount-code" class="discount-input" placeholder="Promo code">
            <button class="discount-btn" onclick="applyDiscount()">Apply</button>
            <div id="discount-msg" class="discount-msg"></div>
        </div>

        <div class="cart-shipping-selector">
            <label for="cart-destination">Deliver to:</label>
            <select id="cart-destination">
                <option value="uk">United Kingdom</option>
                <option value="int">International</option>
            </select>
        </div>

        <div class="cart-total-row">
            <span>Items:</span>
            <span id="cart-subtotal">£0.00</span>
        </div>
        <div class="cart-total-row" style="color: #aaaaaa;">
            <span>Postage:</span>
            <span id="cart-shipping-cost">£0.00</span>
        </div>
        <div class="cart-final-total-row">
            <span>Total:</span>
            <span id="cart-total">£0.00</span>
        </div>
        
        <div id="paypal-button-container" style="margin-top: 15px;"></div>
    </div>
</div>

<!-- Custom Stock Alert Modal -->
<div id="stock-alert" class="stock-alert-overlay">
    <div class="stock-alert-box">
        <h2 style="margin-top: 0; color: #cc0000;">Stock Limit Reached</h2>
        <p id="stock-alert-msg"></p>
        <button class="stock-alert-btn" onclick="document.getElementById('stock-alert').style.display='none'">Understood</button>
    </div>
</div>
