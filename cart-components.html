<style>
    /* --- Global Cart UI Base Styles --- */
    .cart-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 3000; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
    .cart-panel { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; height: 100dvh; background: #0a0a0a; border-left: 1px solid #333333; z-index: 3001; transition: right 0.3s ease; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; }
    .cart-overlay.active { opacity: 1; visibility: visible; }
    .cart-panel.active { right: 0; }
    .cart-header { padding: 20px; border-bottom: 1px solid #333333; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .cart-header h2 { margin: 0; font-family: 'Spectral', serif; font-weight: 400; color: #ffffff; }
    .close-cart-btn { background: none; border: none; color: #ffffff; font-size: 1.5rem; cursor: pointer; }
    .cart-items-container { flex-grow: 1; padding: 20px; overflow-y: auto; min-height: 150px; }
    .cart-panel::-webkit-scrollbar, .cart-items-container::-webkit-scrollbar { width: 8px; }
    .cart-panel::-webkit-scrollbar-track, .cart-items-container::-webkit-scrollbar-track { background: #111111; border-radius: 4px; }
    .cart-panel::-webkit-scrollbar-thumb, .cart-items-container::-webkit-scrollbar-thumb { background: #444444; border-radius: 4px; }
    .cart-panel::-webkit-scrollbar-thumb:hover, .cart-items-container::-webkit-scrollbar-thumb:hover { background: #cc0000; }
    
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid #333333; gap: 10px; color: #ffffff; font-family: 'Lato', sans-serif;}
    .cart-item-details { flex-grow: 1; }
    .cart-item-title { margin: 0 0 5px 0; font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .cart-item-meta { font-size: 0.85rem; color: #aaaaaa; margin: 0 0 5px 0; }
    
    .cart-qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn { background: #222; border: none; color: #fff; width: 25px; height: 25px; cursor: pointer; border-radius: 3px; }
    .remove-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 1.5rem; padding: 0 0 0 0.5rem; transition: color 0.2s; }
    .remove-btn:hover { color: #cc0000; }
    
    .cart-footer { padding: 20px; border-top: 1px solid #333333; background: #000000; flex-shrink: 0; color: #ffffff; font-family: 'Lato', sans-serif;}
    .cart-shipping-selector { margin-bottom: 1rem; border-bottom: 1px solid #222; padding-bottom: 1rem; }
    .cart-shipping-selector label { display: block; color: #aaa; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .cart-shipping-selector select { width: 100%; padding: 0.8rem; background: #111; color: #fff; border: 1px solid #333; border-radius: 3px; cursor: pointer; font-family: 'Lato', sans-serif; }
    
    .discount-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 15px; }
    .discount-input { flex-grow: 1; padding: 0.8rem; background: #111; border: 1px solid #333; color: #fff; border-radius: 3px; font-family: 'Lato', sans-serif; }
    .discount-btn { background: #333; color: #fff; border: 1px solid #444; padding: 0.8rem 1.5rem; cursor: pointer; border-radius: 3px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.8rem; transition: 0.3s ease; }
    .discount-btn:hover { background: #cc0000; border-color: #cc0000; }
    .discount-msg { width: 100%; font-size: 0.85rem; margin-top: 5px; }
    .cart-discount-row { display: flex; justify-content: space-between; color: #28a745; margin-bottom: 10px; font-family: 'Lato', sans-serif; }

    .cart-total-row { display: flex; justify-content: space-between; font-size: 1rem; font-family: 'Lato', sans-serif; margin-bottom: 10px; }
    .cart-final-total-row { display: flex; justify-content: space-between; color: #cc0000; margin-top: 10px; border-top: 1px solid #333; padding-top: 15px; font-weight: 700; font-family: 'Spectral', serif; font-size: 1.5rem; }
    .cart-warning { background: rgba(204, 0, 0, 0.1); border: 1px solid #cc0000; color: #cc0000; font-weight: bold; text-align: center; padding: 1rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; line-height: 1.4; display: none; }
    .paypal-disabled { pointer-events: none; opacity: 0.4; filter: grayscale(100%); }

    .stock-alert-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 4000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
    .stock-alert-box { background: #0a0a0a; border: 1px solid #cc0000; padding: 2.5rem; border-radius: 4px; max-width: 400px; width: 90%; text-align: center; color: #fff; box-shadow: 0 10px 30px rgba(204,0,0,0.15); }
    .stock-alert-box p { margin-bottom: 2rem; font-size: 1.1rem; font-family: 'Lato', sans-serif;}
    .stock-alert-btn { background: #cc0000; color: #fff; border: none; padding: 1rem 2rem; text-transform: uppercase; font-weight: 300; letter-spacing: 1px; cursor: pointer; border-radius: 3px; transition: background 0.3s ease; width: 100%; font-family: 'Lato', sans-serif; }
    .stock-alert-btn:hover { background: #e60000; }

    @media (max-width: 600px) {
        .cart-panel { padding: 1rem; width: 100%; right: -100%; border-left: none; }
        .cart-items-container { padding: 10px 5px; }
        .cart-header, .cart-footer { padding: 10px 0; }
    }
</style>

<!-- Slide-Out Shopping Cart -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
<div class="cart-panel" id="cart-panel">
    <div class="cart-header">
        <h2 id="cart-title">Your Cart</h2>
        <button class="close-cart-btn" onclick="closeCart()">&times;</button>
    </div>
    <div class="cart-items-container" id="cart-items"></div>
    <div class="cart-footer">
        <div class="cart-warning" id="cart-warning">
            Minimum wholesale spend is £75.00 before postage.
        </div>
        
        <div class="discount-container" id="discount-container">
            <input type="text" id="discount-code" class="discount-input" placeholder="Promo code">
            <button class="discount-btn" onclick="applyDiscount()">Apply</button>
            <div id="discount-msg" class="discount-msg"></div>
        </div>

        <div class="cart-shipping-selector">
            <label for="cart-destination">Deliver to:</label>
            <select id="cart-destination">
                <option value="uk">United Kingdom</option>
                <option value="int">International</option>
            </select>
        </div>

        <div class="cart-total-row">
            <span>Items:</span>
            <span id="cart-subtotal">£0.00</span>
        </div>
        <div class="cart-total-row" style="color: #aaaaaa;">
            <span>Postage:</span>
            <span id="cart-shipping-cost">£0.00</span>
        </div>
        <div class="cart-final-total-row">
            <span>Total:</span>
            <span id="cart-total">£0.00</span>
        </div>
        
        <div id="paypal-button-container" style="margin-top: 15px;"></div>
    </div>
</div>

<!-- Custom Stock Alert Modal -->
<div id="stock-alert" class="stock-alert-overlay">
    <div class="stock-alert-box">
        <h2 style="margin-top: 0; color: #cc0000;">Stock Limit Reached</h2>
        <p id="stock-alert-msg"></p>
        <button class="stock-alert-btn" onclick="document.getElementById('stock-alert').style.display='none'">Understood</button>
    </div>
</div>
