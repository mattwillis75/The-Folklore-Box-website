<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multitrack Web Audio DAW</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
  
  <style>
    :root {
      --white-key-width: 36px;
      --keyboard-height: 140px;
    }

    body { 
      margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; 
      background: #121212; color: #e0e0e0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden; 
      -webkit-user-select: none;
      user-select: none;
    }
    
    #toolbar {
      background: #252526; border-bottom: 1px solid #000; padding: 10px 20px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 15px; z-index: 2000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .toolbar-group { display: flex; align-items: center; gap: 10px; padding-right: 15px; border-right: 1px solid #444; }
    .toolbar-group:last-child { border-right: none; }
    .toolbar-label { font-size: 0.7rem; text-transform: uppercase; color: #888; font-weight: bold; margin-bottom: 4px; }
    .control-stack { display: flex; flex-direction: column; }
    
    button, .file-btn { 
      padding: 6px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; 
      background: #3a3d41; color: #fff; border: 1px solid #555; border-radius: 4px;
      display: inline-block; text-align: center; transition: all 0.2s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled), .file-btn:hover { background: #505459; border-color: #777; }
    .btn-primary { background: #007acc; border-color: #005f9e; }
    .btn-primary:hover:not(:disabled) { background: #0098ff; border-color: #007acc; }
    .btn-accent { background: #ff3366; border-color: #cc0033; }
    .btn-save { background: #238636; border-color: #2ea043; }
    .btn-save:hover:not(:disabled) { background: #2ea043; border-color: #3fb950; }
    
    /* Fixed widths prevent the toolbar from re-wrapping when text changes */
    #playBtn { width: 120px; }
    #recordBtn { width: 120px; }
    #stopBtn { width: 90px; }

    .btn-record { background: #a00; border-color: #600; color: #fff; }
    .btn-record.recording { background: #ff0033; border-color: #ff3366; box-shadow: 0 0 10px #ff0033; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    input[type="file"] { display: none; } 
    input[type="range"] { width: 80px; cursor: pointer; accent-color: #007acc; }
    
    select {
      padding: 6px; background: #3a3d41; color: white; 
      border: 1px solid #555; border-radius: 4px; outline: none;
      font-size: 0.8rem; font-weight: bold; cursor: pointer;
    }

    #workspace { flex: 1; display: flex; flex-direction: column; overflow: auto; background: #1e1e1e; position: relative; scroll-behavior: smooth;}
    
    #timelineUI { display: flex; flex-direction: column; padding-bottom: 300px; position: relative; min-height: 100%; width: max-content; }

    #ruler-wrapper { display: flex; height: 30px; border-bottom: 1px solid #333; background: #222; position: sticky; top: 0; z-index: 1001; cursor: pointer; }
    #ruler-header { box-sizing: border-box; width: 220px; min-width: 220px; background: #2a2d2e; border-right: 2px solid #000; position: sticky; left: 0; z-index: 1002; cursor: default; }
    #ruler-canvas-container { flex: 1; position: relative; }

    .section-divider { 
      position: sticky; left: 0; z-index: 998; background: #111; color: #666; 
      font-size: 0.7rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; 
      padding: 5px 15px; border-bottom: 1px solid #333; width: 100vw;
    }

    .track-wrapper { display: flex; height: 125px; border-bottom: 1px solid #2d2d2d; background: #1a1a1a; transition: transform 0.2s; }

    .track-header {
      box-sizing: border-box; 
      width: 220px; min-width: 220px; position: sticky; left: 0; background: #2a2d2e; z-index: 1000;
      padding: 10px; border-right: 2px solid #000; display: flex; flex-direction: column; justify-content: center;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
    }
    .track-name { flex: 1; font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ddd; }
    .track-control-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.65rem; color: #aaa; margin-bottom: 2px; font-weight: bold; }
    .track-control-row input { width: 140px; margin: 0; }

    .track-canvas-container { position: relative; background: #111; }
    .canvas-container { margin: 0; padding: 0; height: 100%; display: flex; align-items: center; }
    
    #playhead {
      position: absolute; top: 30px; bottom: 0; width: 2px; background: #ff3366; box-shadow: 0 0 6px #ff3366;
      z-index: 999; left: 220px; display: none; cursor: ew-resize; pointer-events: auto;
    }
    #playhead::before { content: '▼'; position: absolute; top: -10px; left: -5px; color: #ff3366; font-size: 14px; pointer-events: none; }
    
    #empty-state { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #555; pointer-events: none; }

    #keyboard-panel {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; 
      background: #252526; padding: 15px; border-top: 2px solid #444; z-index: 2005;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }
    
    #keys-container {
      display: flex;
      height: var(--keyboard-height);
      overflow-x: auto;
      padding-bottom: 8px;
      padding-top: 5px;
      scroll-behavior: smooth;
      background: #111;
      touch-action: pan-x;
    }
    .key-btn {
      cursor: pointer;
      font-weight: bold;
      font-size: 0.65rem;
      border-radius: 0 0 4px 4px;
      transition: background 0.1s;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none; 
      flex-shrink: 0;
    }
    .key-white { 
      background: #fff; color: #111; 
      width: var(--white-key-width); height: 100%; 
      border: 1px solid #ccc;
      z-index: 1; position: relative;
    }
    .key-black { 
      background: #222; color: #eee; 
      width: calc(var(--white-key-width) * 0.61); height: 65%; 
      border: 1px solid #000;
      z-index: 2; position: relative;
      margin-left: calc(var(--white-key-width) * -0.305); margin-right: calc(var(--white-key-width) * -0.305); 
    }
    .key-btn.active { 
      background: #ff3366 !important; color: white !important; 
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <div class="toolbar-group">
      <div class="control-stack">
        <span class="toolbar-label">Session Data</span>
        <div style="display: flex; gap: 5px;">
          <button id="saveBtn" class="btn-save">💾 Save .daw</button>
          <label class="file-btn" title="Select your .daw file AND original audio files">📂 Load<input type="file" id="loadBtn" accept=".daw,audio/*" multiple></label>
        </div>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack"><span class="toolbar-label">Import Audio</span><label class="file-btn">+ Audio<input type="file" id="trackUpload" accept="audio/*" multiple></label></div>
      <div class="control-stack"><span class="toolbar-label">Reverb Space</span><label class="file-btn">+ IR<input type="file" id="irUpload" accept="audio/*"></label></div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack">
        <span class="toolbar-label">Transport</span>
        <div style="display: flex; gap: 5px;">
          <button id="playBtn" class="btn-primary">▶ Play</button>
          <button id="recordBtn" class="btn-record">🔴 Rec</button>
          <button id="stopBtn" disabled>⏸ Pause</button>
          <button id="metronomeBtn" style="background: #333; border-color: #555;">🔔 Click Off</button>
        </div>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack">
        <span class="toolbar-label">Zoom</span>
        <div style="display: flex; gap: 5px;"><button id="zoomOutBtn">🔍 -</button><button id="zoomInBtn">🔍 +</button></div>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack">
        <span class="toolbar-label">Drum Machine</span>
        <div style="display: flex; gap: 5px;">
          <select id="synthSelect">
            <option value="kick">💥 Kick</option>
            <option value="snare">🥁 Snare</option>
            <option value="hihat">🎩 Hi-Hat</option>
            <option value="bass">🎸 Synth Bass</option>
            <option value="laser">🔫 Laser</option>
            <option value="chime">✨ Chime</option>
          </select>
          <button id="newDrumTrackBtn" class="btn-accent" style="background: #00aaff; border-color: #007acc;">➕ New Track</button>
          <button id="beatBtn" class="btn-accent">+ Seq</button>
        </div>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack">
        <span class="toolbar-label">Melody</span>
        <button id="toggleKeyboardBtn" class="btn-accent" style="background: #9933ff; border-color: #7a29cc;">🎹 Keyboard</button>
      </div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack"><span class="toolbar-label">Vol/Rev</span><input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8"></div>
      <div class="control-stack"><span class="toolbar-label" style="visibility: hidden;">Rev</span><input type="range" id="mixSlider" min="0" max="1" step="0.01" value="0.3"></div>
    </div>
    <div class="toolbar-group">
      <div class="control-stack"><span class="toolbar-label">Humanize</span><input type="range" id="humanizeSlider" min="0" max="1" step="0.01" value="0.2" title="Adds micro-timing and volume variations"></div>
      <div class="control-stack"><span class="toolbar-label">Analog Warmth</span><input type="range" id="analogSlider" min="0" max="1" step="0.01" value="0.3" title="Adds pitch drift (wow/flutter) and filter saturation"></div>
    </div>
    
    <div class="toolbar-group" style="border-right: none; margin-left: auto;">
      <div style="display: flex; gap: 5px; align-items: center;">
        <select id="exportFormatSelect" style="height: 100%;">
          <option value="wav">.WAV</option>
          <option value="mp3">.MP3</option>
        </select>
        <button id="exportBtn">⬇ Export</button>
      </div>
    </div>
  </div>

  <div id="workspace">
    <div id="empty-state">
      <h2>Your Session is Empty</h2>
      <p>Add an audio track or drop a drum sequence to begin.</p>
    </div>
    
    <div id="timelineUI">
      <div id="ruler-wrapper" style="display: none;">
        <div id="ruler-header"></div>
        <div id="ruler-canvas-container"><canvas id="rulerCanvas" height="30"></canvas></div>
      </div>
      
      <div id="audio-tracks-container"></div>
      <div id="synth-tracks-container"></div>
      
      <div id="playhead"></div>
    </div>
  </div> 

  <div id="keyboard-panel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div id="sequence-display" style="flex: 1; color: #00ffcc; font-weight: bold; font-family: monospace; font-size: 1rem; overflow-x: auto; white-space: nowrap; background: #1a1a1a; padding: 6px; border-radius: 4px; border: 1px solid #444; margin-right: 15px; scrollbar-width: none;">Seq: []</div>
      <div style="display: flex; align-items: center; gap: 5px; flex-shrink: 0;">
        <button id="insertSequenceBtn" class="btn-primary">Insert Step Seq</button>
        <button id="clearSequenceBtn">Clear Notes</button>
        <button id="closeKeyboardBtn" style="background: transparent; border: none; font-size: 1.2rem; margin-left: 10px; cursor: pointer; color: #ccc;">✖</button>
      </div>
    </div>
    
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
        <select id="melodyPatchSelect">
          <option value="square-pluck">🤖 The Robots (Pluck)</option>
          <option value="saw-brass">🎺 Autobahn (Brass)</option>
          <option value="pwm-string">🎻 Trans-Europe (Strings)</option>
          <option value="sine-ghost">👻 Radioactivity (Sine)</option>
          <option value="acoustic-guitar">🎸 Acoustic Guitar</option>
          <option value="electric-guitar">⚡ Electric Guitar</option>
          <option value="bass-guitar">🎸 Bass Guitar</option>
          <option value="harp">👼 Harp</option>
          <option value="e-piano">🎹 Electric Piano</option>
          <option value="midi-drums">🥁 Drum Kit (Standard MIDI)</option>
        </select>
        <button id="newMelodyTrackBtn" class="btn-accent" style="background: #9933ff; border-color: #7a29cc;">➕ New Track</button>
        
        <span style="color: #ccc; font-size: 0.8rem; margin-left: 10px;">1 Beat = (sec):</span>
        <input type="number" id="noteGapInput" value="0.25" step="0.1" min="0.1" style="width: 50px; padding: 4px; border-radius: 4px; border: none;">
        
        <label style="color: #00ffcc; font-size: 0.8rem; margin-left: 5px; display: flex; align-items: center; gap: 4px; cursor: pointer; font-weight: bold;">
          <input type="checkbox" id="quantizeCheckbox" style="accent-color: #ff3366;" checked> Auto-Quantize
        </label>

        <span style="color: #ccc; font-size: 0.8rem; margin-left: 15px;">Key Size:</span>
        <input type="range" id="keySizeSlider" min="0.5" max="2" step="0.1" value="1" style="width: 80px; accent-color: #ff3366;">
    </div>
    
    <div id="keys-container"></div>
    
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 15px; border-top: 1px solid #444; padding-top: 15px;">
      <span style="color: #ccc; font-size: 0.8rem;">Text Input:</span>
      <input type="text" id="textSequenceInput" placeholder="A0:2, C4, D#4:2 E4, C8" style="padding: 4px; border-radius: 4px; border: 1px solid #555; width: 320px; background: #111; color: #00ffcc; font-family: monospace;">
      <button id="addTextSequenceBtn" class="btn-primary" style="padding: 4px 10px;">Add Sequence String</button>
      <span style="color: #666; font-size: 0.75rem;">(Format: Note:Beats | Space = Rest | Range: A0-C8)</span>
    </div>
  </div>

  <script>
    // --- STATE MANAGEMENT ---
    let isRazorToolActive = false;
    let startedAt = 0, pausedAt = 0, longestDuration = 5, animFrameId = null;  
    let pixelsPerSecond = 100; 
    const HEADER_WIDTH = 220; 

    let audioCtx, masterBus, masterCompressor, convolver, masterGainNode, dryGainNode, wetGainNode;
    let tracks = []; 
    let activeSynthTracks = {}; 
    let activeMelodicTrack = null; 
    let melodyTrackCount = 0;
    let isPlaying = false;
    let isRecording = false;
    let isDraggingPlayhead = false;
    let recordedSequence = []; 
    let replacingNote = null; 
    
    // Metronome Variables
    let isMetronomeActive = false;
    let metronomeNodes = [];
    
    const activeTouches = new Map();
    const colors = ['#00ffcc', '#00aaff', '#ffff00', '#ffaa00', '#ff3366', '#aaff00'];
    let undoStack = [], redoStack = [], clipboard = null;

    const trackInput = document.getElementById('trackUpload');
    const irInput = document.getElementById('irUpload');
    const playBtn = document.getElementById('playBtn');
    const recordBtn = document.getElementById('recordBtn');
    const stopBtn = document.getElementById('stopBtn');
    const metronomeBtn = document.getElementById('metronomeBtn');
    const beatBtn = document.getElementById('beatBtn');
    const newDrumTrackBtn = document.getElementById('newDrumTrackBtn');
    const synthSelect = document.getElementById('synthSelect');
    const exportBtn = document.getElementById('exportBtn');
    const exportFormatSelect = document.getElementById('exportFormatSelect');
    const volumeSlider = document.getElementById('volumeSlider');
    const mixSlider = document.getElementById('mixSlider');
    const humanizeSlider = document.getElementById('humanizeSlider');
    const analogSlider = document.getElementById('analogSlider');
    const quantizeCheckbox = document.getElementById('quantizeCheckbox');
    const keySizeSlider = document.getElementById('keySizeSlider');
    
    const timelineUI = document.getElementById('timelineUI');
    const audioContainer = document.getElementById('audio-tracks-container');
    const synthContainer = document.getElementById('synth-tracks-container');
    const playhead = document.getElementById('playhead');
    const emptyState = document.getElementById('empty-state');
    const saveBtn = document.getElementById('saveBtn');
    const loadBtn = document.getElementById('loadBtn');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const rulerWrapper = document.getElementById('ruler-wrapper');
    const rulerCanvasContainer = document.getElementById('ruler-canvas-container');

    const toggleKeyboardBtn = document.getElementById('toggleKeyboardBtn');
    const keyboardPanel = document.getElementById('keyboard-panel');
    const closeKeyboardBtn = document.getElementById('closeKeyboardBtn');
    const keysContainer = document.getElementById('keys-container');
    const sequenceDisplay = document.getElementById('sequence-display');
    const clearSequenceBtn = document.getElementById('clearSequenceBtn');
    const insertSequenceBtn = document.getElementById('insertSequenceBtn');
    const textSequenceInput = document.getElementById('textSequenceInput');
    const addTextSequenceBtn = document.getElementById('addTextSequenceBtn');
    const noteGapInput = document.getElementById('noteGapInput');
    const newMelodyTrackBtn = document.getElementById('newMelodyTrackBtn');
    const melodyPatchSelect = document.getElementById('melodyPatchSelect');

    const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const musicalNotes = [];
    for (let midi = 21; midi <= 108; midi++) {
      const noteName = noteNames[midi % 12];
      const octave = Math.floor(midi / 12) - 1;
      const fullName = noteName + octave;
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      const isBlack = noteName.includes('#');
      musicalNotes.push({
        name: fullName,
        freq: parseFloat(freq.toFixed(2)),
        color: isBlack ? 'black' : 'white'
      });
    }

    function gc(context, hTime, duration, nodesArray) {
        const gcTime = (Math.max(0, hTime - context.currentTime) + duration + 2.0) * 1000;
        setTimeout(() => {
            nodesArray.forEach(node => {
                if (node) { try { node.disconnect(); } catch(e){} }
            });
        }, gcTime);
    }

    // --- BULLETPROOF AUDIO SYNC ENGINE ---
    // Enforces strict synchronous wakeup to bypass iPad/Safari muting bugs
    function initAudioEngineSync() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        if (navigator.audioSession) {
            try { navigator.audioSession.type = 'playback'; } catch(e) {}
        }
      }
      
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (!masterBus) {
        masterBus = audioCtx.createGain(); 
        masterCompressor = audioCtx.createDynamicsCompressor(); 
        convolver = audioCtx.createConvolver();
        masterGainNode = audioCtx.createGain(); 
        dryGainNode = audioCtx.createGain(); 
        wetGainNode = audioCtx.createGain();
        
        const vol = volumeSlider ? parseFloat(volumeSlider.value) : 0.8;
        masterGainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
        
        const mix = mixSlider ? parseFloat(mixSlider.value) : 0.3;
        dryGainNode.gain.setValueAtTime(1.0 - mix, audioCtx.currentTime); 
        wetGainNode.gain.setValueAtTime(mix, audioCtx.currentTime);
        
        masterBus.connect(masterCompressor); 
        masterCompressor.connect(dryGainNode); 
        masterCompressor.connect(convolver);   
        convolver.connect(wetGainNode); 
        dryGainNode.connect(masterGainNode); 
        wetGainNode.connect(masterGainNode); 
        masterGainNode.connect(audioCtx.destination);
      }
    }

    // Globally intercept any interactions to ensure iOS audio is awake
    ['touchstart', 'mousedown', 'keydown'].forEach(evt => {
        document.addEventListener(evt, () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { capture: true, passive: true });
    });

    let distCurve = null;
    function getDistortionCurve(amount = 50) {
        if (distCurve) return distCurve;
        const n_samples = 44100; const curve = new Float32Array(n_samples);
        const deg = Math.PI / 180;
        for (let i = 0; i < n_samples; ++i) {
            const x = i * 2 / n_samples - 1;
            curve[i] = (3 + amount) * x * 20 * deg / (Math.PI + amount * Math.abs(x));
        }
        distCurve = curve;
        return curve;
    }

    keySizeSlider.addEventListener('input', (e) => {
        const scale = parseFloat(e.target.value);
        document.documentElement.style.setProperty('--white-key-width', (36 * scale) + 'px');
        document.documentElement.style.setProperty('--keyboard-height', (140 * scale) + 'px');
    });

    let isPanning = false, startX, startY, scrollLeft, scrollTop;
    let isSpaceDown = false;
    let hasDraggedDuringSpace = false;
    const workspaceEl = document.getElementById('workspace');

    window.addEventListener('mousedown', (e) => {
        if (isSpaceDown || e.button === 1 || e.altKey) {
            isPanning = true;
            document.body.style.cursor = 'grabbing';
            tracks.forEach(t => { if(t.fabCanvas) t.fabCanvas.defaultCursor = 'grabbing'; });
            startX = e.clientX;
            startY = e.clientY;
            scrollLeft = workspaceEl.scrollLeft;
            scrollTop = workspaceEl.scrollTop;
            e.preventDefault();
            e.stopPropagation();
        }
    }, { capture: true });

    window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        hasDraggedDuringSpace = true;
        e.preventDefault();
        e.stopPropagation();
        const walkX = (e.clientX - startX);
        const walkY = (e.clientY - startY);
        workspaceEl.scrollLeft = scrollLeft - walkX;
        workspaceEl.scrollTop = scrollTop - walkY;
    }, { capture: true });

    window.addEventListener('mouseup', (e) => {
        if (isPanning) {
            isPanning = false;
            document.body.style.cursor = (isSpaceDown || e.altKey) ? 'grab' : 'default';
            tracks.forEach(t => { if(t.fabCanvas) t.fabCanvas.defaultCursor = (isSpaceDown || e.altKey) ? 'grab' : 'default'; });
            e.preventDefault();
            e.stopPropagation();
        }
    }, { capture: true });

    metronomeBtn.addEventListener('click', () => {
        initAudioEngineSync();
        isMetronomeActive = !isMetronomeActive;
        if (isMetronomeActive) {
            metronomeBtn.style.background = '#007acc';
            metronomeBtn.innerText = '🔔 Click On';
        } else {
            metronomeBtn.style.background = '#333';
            metronomeBtn.innerText = '🔔 Click Off';
        }
    });

    function updatePlayhead() {
    if (!isPlaying) return;

    // Calculate current time and convert to pixels
    const currentAudioTime = audioCtx.currentTime - startedAt;
    const newPos = HEADER_WIDTH + (currentAudioTime * pixelsPerSecond);

    // Update playhead position
    playhead.style.left = newPos + 'px';

    // Auto-stop if it reaches the end of the timeline
    if (currentAudioTime >= longestDuration) {
        stopBtn.click();
        return;
    }

    // Request the next animation frame
    animFrameId = requestAnimationFrame(updatePlayhead);
}

    function startPlayback() {
      if (isPlaying) return;
      if (document.activeElement) document.activeElement.blur();
      initAudioEngineSync();
      startedAt = audioCtx.currentTime - pausedAt;
      
      const hVal = parseFloat(humanizeSlider.value);
      const aVal = parseFloat(analogSlider.value);
      
      // Schedule Metronome
      if (isMetronomeActive) {
          const gap = parseFloat(noteGapInput.value) || 0.25;
          const totalBeats = Math.ceil((longestDuration + 10) / gap);
          for(let i=0; i<totalBeats; i++) {
              const clickTime = startedAt + (i * gap);
              if (clickTime >= audioCtx.currentTime) {
                  const osc = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  osc.type = 'square';
                  osc.frequency.setValueAtTime(i % 4 === 0 ? 1200 : 800, clickTime);
                  osc.frequency.exponentialRampToValueAtTime(100, clickTime + 0.05);
                  gain.gain.setValueAtTime(0.3, clickTime);
                  gain.gain.exponentialRampToValueAtTime(0.001, clickTime + 0.05);
                  osc.connect(gain); gain.connect(masterBus);
                  osc.start(clickTime); osc.stop(clickTime + 0.05);
                  metronomeNodes.push({osc, gain});
              }
          }
      }
      
      tracks.forEach(track => {
        if (track.type === 'audio') {
            track.liveNodes = [];
            const audioObjects = track.fabCanvas.getObjects();
            
            audioObjects.forEach(obj => {
                const source = audioCtx.createBufferSource(); 
                source.buffer = track.buffer; 
                source.connect(track.inputNode);
                
                // Calculate time data from the Fabric object's visual properties
                const startTimelineTime = startedAt + (obj.left / pixelsPerSecond);
                const cropOffsetTime = (obj.cropX || 0) * obj.scaleX / pixelsPerSecond;
                const playDuration = (obj.width * obj.scaleX) / pixelsPerSecond;
                
                if (pausedAt < (obj.left / pixelsPerSecond)) {
                    source.start(startTimelineTime, cropOffsetTime, playDuration);
                } else {
                    const skipAmount = pausedAt - (obj.left / pixelsPerSecond);
                    if (skipAmount < playDuration) {
                        source.start(0, cropOffsetTime + skipAmount, playDuration - skipAmount);
                    }
                }
                track.liveNodes.push({ source });
            });
        }
        } else if (track.type === 'melodic') {
          track.liveNodes = [];
          track.hits.forEach(hit => { 
             if (hit.time + (hit.duration || 0.25) > pausedAt) { 
                 triggerMelody(audioCtx, startedAt + hit.time, hit.freq, track.inputNode, track, hit.duration || 0.25, hVal, aVal); 
             } 
          });
        }
      });
      isPlaying = true; playBtn.disabled = true; playBtn.innerHTML = "▶ Playing..."; stopBtn.disabled = false; updatePlayhead();
    }

    beatBtn.addEventListener('click', () => {

    function ensureMelodicTrackExists() {
      if (!activeMelodicTrack) {
        melodyTrackCount++;
        const nodes = createChannelStripNodes();
        const patchName = melodyPatchSelect.options[melodyPatchSelect.selectedIndex].text;
        const newTrack = { 
          id: Math.random().toString(36).substr(2, 9), type: 'melodic', hits: [], 
          inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, 
          name: '🎹 Melody ' + melodyTrackCount + ' (' + patchName + ')', liveNodes: [], patch: melodyPatchSelect.value, trackId: melodyTrackCount 
        };
        tracks.push(newTrack); activeMelodicTrack = newTrack; createTrackUI(newTrack, '#9933ff');
      }
    }

    musicalNotes.forEach(note => {
      const btn = document.createElement('button');
      btn.innerText = note.name; 
      btn.className = `key-btn key-${note.color}`;
      btn.title = `${note.name} (${note.freq} Hz)`;
      
      const handleKeyStart = (e) => {
        if (e.type === 'touchstart') e.preventDefault(); 
        
        if (btn.dataset.pressed === 'true') return;
        btn.dataset.pressed = 'true';
        btn.classList.add('active');
        
        if (e.pointerId !== undefined) {
            try { btn.setPointerCapture(e.pointerId); } catch(err) {}
        }
        
        initAudioEngineSync();
        
        if (btn.dataset.pressed !== 'true') return;
        
        const hVal = parseFloat(humanizeSlider.value);
        const aVal = parseFloat(analogSlider.value);
        
        if (replacingNote) {
            const targetTrack = replacingNote.track;
            const hit = targetTrack.hits[replacingNote.index];
            hit.freq = note.freq; hit.name = note.name;
            
            const textObj = replacingNote.obj.item(1);
            if (textObj && textObj.type === 'text') textObj.set('text', note.name);
            
            replacingNote.obj.set('strokeWidth', 1);
            replacingNote.obj.set('stroke', '#000');
            targetTrack.fabCanvas.requestRenderAll();
            
            triggerMelody(audioCtx, audioCtx.currentTime, note.freq, masterBus, targetTrack, 0.5, hVal, aVal);
            replacingNote = null;
            return; 
        }
        
        if (isRecording && !isPlaying) {
            startPlayback();
        }
        
        const dummyTrackObj = { patch: melodyPatchSelect.value, liveNodes: [] };
        triggerMelody(audioCtx, audioCtx.currentTime, note.freq, masterBus, dummyTrackObj, 10.0, 0, aVal); 
        
        const hitTime = isPlaying ? (audioCtx.currentTime - startedAt) : pausedAt;
        activeTouches.set(btn, { note, noteOnTime: audioCtx.currentTime, hitTime, dummyTrackObj });
      };

      const handleKeyEnd = (e) => {
        if (e && (e.type === 'touchend' || e.type === 'touchcancel')) e.preventDefault();
        
        btn.dataset.pressed = 'false';
        btn.classList.remove('active');
        
        if (e.pointerId !== undefined) {
            try { btn.releasePointerCapture(e.pointerId); } catch(err) {}
        }
        
        if (!activeTouches.has(btn)) return;
        
        const touch = activeTouches.get(btn);
        activeTouches.delete(btn);
        
        const gap = parseFloat(noteGapInput.value) || 0.25;
        const releaseTime = Math.max(audioCtx.currentTime, touch.noteOnTime + 0.05); 
        const rawDur = releaseTime - touch.noteOnTime;
        
        touch.dummyTrackObj.liveNodes.forEach(nodes => {
            Object.values(nodes).forEach(n => {
                if (n && n.stop) { try { n.stop(releaseTime + 0.3); } catch(err){} }
                if (n && n.gain) { 
                    try { 
                        n.gain.cancelScheduledValues(releaseTime); 
                        n.gain.setTargetAtTime(0, releaseTime, 0.03); 
                    } catch(err){} 
                }
            });
        });
        
        if (isRecording) {
            saveState();
            ensureMelodicTrackExists();
            activeMelodicTrack.patch = melodyPatchSelect.value;
            
            let finalTime = touch.hitTime;
            let finalDur = Math.max(0.1, rawDur); 
            
            if (quantizeCheckbox.checked) {
                const snapInterval = gap / 4; 
                finalTime = Math.round(finalTime / snapInterval) * snapInterval;
                finalDur = Math.round(finalDur / snapInterval) * snapInterval;
                finalDur = Math.max(snapInterval, finalDur); 
            }
            
            activeMelodicTrack.hits.push({ time: finalTime, freq: touch.note.freq, name: touch.note.name, duration: finalDur });
            activeMelodicTrack.hits.sort((a,b) => a.time - b.time);
            recalculateDuration();
        } else {
            const calculatedBeats = Math.max(0.25, parseFloat((rawDur / gap).toFixed(2)));
            recordedSequence.push({ ...touch.note, beats: calculatedBeats }); 
            updateSequenceDisplay();
        }
      };

      btn.addEventListener('pointerdown', handleKeyStart);
      btn.addEventListener('pointerup', handleKeyEnd);
      btn.addEventListener('pointercancel', handleKeyEnd);
      btn.addEventListener('pointerleave', handleKeyEnd);
      
      keysContainer.appendChild(btn);
    });

    function updateSequenceDisplay() { 
      const seqText = recordedSequence.map(n => {
        if (n.isRest) return n.beats && n.beats !== 1 ? `REST:${n.beats}` : `REST`;
        return n.beats && n.beats !== 1 ? `${n.name}:${n.beats}` : n.name;
      }).join(', ');
      
      sequenceDisplay.innerText = "Seq: [" + seqText + "]"; 
      sequenceDisplay.scrollLeft = sequenceDisplay.scrollWidth;
    }
    
    clearSequenceBtn.addEventListener('click', () => { recordedSequence = []; updateSequenceDisplay(); });

    addTextSequenceBtn.addEventListener('click', () => {
      const val = textSequenceInput.value.trim();
      if (!val) return;
      
      let normalized = val.replace(/\s*,\s*/g, ',');
      normalized = normalized.replace(/\s+/g, ' ');
      
      const groups = normalized.split(' ');
      
      groups.forEach((group, index) => {
        const parts = group.split(',');
        parts.forEach(p => {
          if (!p) return;
          const subParts = p.split(':');
          const noteName = subParts[0].trim().toUpperCase();
          const beats = subParts.length > 1 ? parseFloat(subParts[1]) : 1;
          
          if (noteName === 'REST' || noteName === '-') {
              recordedSequence.push({ isRest: true, name: '-', beats: isNaN(beats) ? 1 : beats });
          } else {
              const note = musicalNotes.find(n => n.name.toUpperCase() === noteName);
              if (note) recordedSequence.push({ ...note, beats: isNaN(beats) ? 1 : beats });
          }
        });
        
        if (index < groups.length - 1) {
            recordedSequence.push({ isRest: true, name: '-', beats: 1 });
        }
      });
      
      updateSequenceDisplay();
      textSequenceInput.value = '';
    });

    insertSequenceBtn.addEventListener('click', () => {
      if (recordedSequence.length === 0) return;
      initAudioEngineSync(); saveState();
      ensureMelodicTrackExists();
      activeMelodicTrack.patch = melodyPatchSelect.value;

      const gap = parseFloat(noteGapInput.value); 
      let insertTime = pausedAt;
      
      recordedSequence.forEach(note => {
        const duration = gap * (note.beats || 1);
        if (!note.isRest) {
            activeMelodicTrack.hits.push({ time: insertTime, freq: note.freq, name: note.name, duration: duration });
        }
        insertTime += duration;
      });

      recordedSequence = []; updateSequenceDisplay(); recalculateDuration();
    });

    function swapTrackOrder(id1, id2) {
      const idx1 = tracks.findIndex(t => t.id === id1);
      const idx2 = tracks.findIndex(t => t.id === id2);
      if (idx1 > -1 && idx2 > -1) {
          const temp = tracks[idx1];
          tracks[idx1] = tracks[idx2];
          tracks[idx2] = temp;
      }
    }

    function createChannelStripNodes() {
      const eqNode = audioCtx.createBiquadFilter(); eqNode.type = 'lowpass'; eqNode.frequency.value = 20000; 
      const panNode = audioCtx.createStereoPanner(); panNode.pan.value = 0; 
      const gainNode = audioCtx.createGain(); gainNode.gain.value = 1.0;
      eqNode.connect(panNode); panNode.connect(gainNode); gainNode.connect(masterBus);
      return { eqNode, panNode, gainNode, inputNode: eqNode };
    }

    function getTimelineWidth() { return Math.max(window.innerWidth - HEADER_WIDTH, longestDuration * pixelsPerSecond + 300); }

    function getCurrentStateSnapshot() {
      return tracks.map(t => ({
        id: t.id || Math.random().toString(36).substr(2, 9), 
        type: t.type, name: t.name, color: t.color, offset: t.offset, trackId: t.trackId,
        hits: t.hits ? t.hits.map(h => typeof h === 'object' ? {...h} : h) : null,
        vol: t.gainNode.gain.value, pan: t.panNode.pan.value, eq: t.eqNode.frequency.value, buffer: t.buffer, instrument: t.instrument, patch: t.patch
      }));
    }

    function saveState() {
      undoStack.push(getCurrentStateSnapshot());
      if (undoStack.length > 30) undoStack.shift(); 
      redoStack = []; 
    }

    function restoreState(state) {
      if (isPlaying) stopBtn.click();
      audioContainer.innerHTML = ''; synthContainer.innerHTML = '';
      tracks = []; activeSynthTracks = {}; activeMelodicTrack = null;
      state.forEach(tData => {
        const nodes = createChannelStripNodes();
        nodes.gainNode.gain.value = tData.vol; nodes.panNode.pan.value = tData.pan; nodes.eqNode.frequency.value = tData.eq;
        if (tData.type === 'synth') {
          const newTrack = { id: tData.id || Math.random().toString(36).substr(2, 9), type: 'synth', instrument: tData.instrument, hits: [...tData.hits], inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, name: tData.name, liveNodes: [] };
          tracks.push(newTrack); activeSynthTracks[tData.instrument] = newTrack; createTrackUI(newTrack, tData.color);
        } else if (tData.type === 'melodic') {
          const newTrack = { id: tData.id || Math.random().toString(36).substr(2, 9), type: 'melodic', patch: tData.patch, trackId: tData.trackId, hits: tData.hits.map(h => ({...h})), inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, name: tData.name, liveNodes: [] };
          tracks.push(newTrack); activeMelodicTrack = newTrack; createTrackUI(newTrack, tData.color);
        } else if (tData.type === 'audio') {
          const newTrack = { id: tData.id || Math.random().toString(36).substr(2, 9), type: 'audio', buffer: tData.buffer, offset: tData.offset, inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, source: null, name: tData.name };
          tracks.push(newTrack); createTrackUI(newTrack, tData.color);
        }
      });
      recalculateDuration();
    }

    function undo() { 
      if (undoStack.length === 0) return; 
      redoStack.push(getCurrentStateSnapshot()); 
      restoreState(undoStack.pop()); 
    }
    
    function redo() { 
      if (redoStack.length === 0) return; 
      undoStack.push(getCurrentStateSnapshot()); 
      restoreState(redoStack.pop()); 
    }

    function copySelection() { 
      let itemsToCopy = [];
      let minTime = Infinity;

      tracks.forEach(track => { 
        if (!track.fabCanvas) return;
        const activeObj = track.fabCanvas.getActiveObject();
        if (!activeObj) return;

        let selectedObjects = (activeObj.type === 'activeSelection') ? activeObj.getObjects() : [activeObj];
        
        selectedObjects.forEach(obj => {
          let time = null;
          let data = null;

          if (track.type === 'audio') {
            time = track.offset;
            data = track.buffer;
          } else if (track.type === 'synth') {
            let idx = obj.drumIndex !== undefined ? obj.drumIndex : track.hits.findIndex(h => Math.abs(h.time * pixelsPerSecond - obj.left) < 2);
            if (idx !== -1 && track.hits[idx] !== undefined) {
              let hit = track.hits[idx];
              time = hit.time;
              data = { instrument: track.instrument, duration: hit.duration || 0.25 };
            }
          } else if (track.type === 'melodic') {
            let idx = obj.melodicIndex !== undefined ? obj.melodicIndex : track.hits.findIndex(h => Math.abs(h.time * pixelsPerSecond - obj.left) < 2);
            if (idx !== -1 && track.hits[idx] !== undefined) {
              let hit = track.hits[idx];
              time = hit.time;
              data = { freq: hit.freq, name: hit.name, duration: hit.duration || 0.25 };
            }
          }

          if (time !== null && !isNaN(time) && data !== null) {
            if (time < minTime) minTime = time;
            itemsToCopy.push({ trackId: track.id, trackType: track.type, time: time, data: data });
          }
        });
      }); 

      if (itemsToCopy.length > 0) {
        clipboard = itemsToCopy.map(item => ({ ...item, relativeTime: item.time - minTime }));
      }
    }

    function pasteSelection() {
      if (!clipboard || clipboard.length === 0) return;
      saveState();

      clipboard.forEach(item => {
        let track = tracks.find(t => t.id === item.trackId);
        if (!track) track = tracks.find(t => t.type === item.trackType);
        if (!track && tracks.length > 0) track = tracks[0];
        if (!track) return; 
        
        let targetTime = pausedAt + item.relativeTime;

        if (track.type === 'synth') {
            track.hits.push({ time: targetTime, duration: item.data.duration || 0.25 }); 
            track.hits.sort((a,b)=>a.time-b.time);
        } else if (track.type === 'melodic') {
            track.hits.push({ time: targetTime, freq: item.data.freq, name: item.data.name, duration: item.data.duration || 0.25 }); 
            track.hits.sort((a,b)=>a.time-b.time);
        } else if (track.type === 'audio') {
            const nodes = createChannelStripNodes();
            nodes.gainNode.gain.value = track.gainNode.gain.value; 
            nodes.panNode.pan.value = track.panNode.pan.value; 
            nodes.eqNode.frequency.value = track.eqNode.frequency.value;
            const newTrack = { 
              id: Math.random().toString(36).substr(2, 9), 
              type: 'audio', buffer: track.buffer, offset: targetTime, 
              inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, 
              source: null, name: track.name + ' (Copy)' 
            };
            tracks.push(newTrack); 
            createTrackUI(newTrack, colors[tracks.length % colors.length]);
        }
      });
      recalculateDuration();
    }

    function deleteSelection() {
      let redrawNeeded = false, modified = false;
      tracks.forEach(track => {
        if (track.fabCanvas) {
          const activeObj = track.fabCanvas.getActiveObject();
          if (activeObj) {
            if (!modified) { saveState(); modified = true; } 
            if (activeObj.type === 'activeSelection') {
                const synthIndices = []; const melodicIndices = [];
                activeObj.getObjects().forEach(child => {
                    if (track.type === 'synth' && child.drumIndex !== undefined) synthIndices.push(child.drumIndex);
                    if (track.type === 'melodic' && child.melodicIndex !== undefined) melodicIndices.push(child.melodicIndex);
                });
                if (track.type === 'synth') synthIndices.sort((a,b)=>b-a).forEach(idx => track.hits.splice(idx, 1));
                if (track.type === 'melodic') melodicIndices.sort((a,b)=>b-a).forEach(idx => track.hits.splice(idx, 1));
                redrawNeeded = true;
            } else {
                if (track.type === 'synth' && activeObj.drumIndex !== undefined) { track.hits.splice(activeObj.drumIndex, 1); redrawNeeded = true; } 
                else if (track.type === 'melodic' && activeObj.melodicIndex !== undefined) { track.hits.splice(activeObj.melodicIndex, 1); redrawNeeded = true; } 
                else if (track.type === 'audio') {
                  const idx = tracks.indexOf(track);
                  if (idx > -1) { tracks.splice(idx, 1); track.fabCanvas.wrapperEl.closest('.track-wrapper').remove(); redrawNeeded = true; }
                }
            }
          }
        }
      });
      if (redrawNeeded) recalculateDuration();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return; 
      
      const isCmdOrCtrl = e.metaKey || e.ctrlKey;
      const key = e.key.toLowerCase();
      
      if (e.key === 'Alt') {
          document.body.style.cursor = 'grab';
          tracks.forEach(t => { 
              if(t.fabCanvas) { t.fabCanvas.selection = false; t.fabCanvas.defaultCursor = 'grab'; } 
      if (key === 'r') {
          isRazorToolActive = !isRazorToolActive;
          const cursorStyle = isRazorToolActive ? 'crosshair' : 'default';
          document.body.style.cursor = cursorStyle;
          tracks.forEach(t => { 
              if(t.fabCanvas) {
                  t.fabCanvas.defaultCursor = cursorStyle;
                  t.fabCanvas.selection = !isRazorToolActive; 
              }
          });
          return;
      }
      
      if (e.code === 'Space') {
          e.preventDefault();
          if (!e.repeat) {
              isSpaceDown = true;
              hasDraggedDuringSpace = false;
              document.body.style.cursor = 'grab';
              tracks.forEach(t => { 
                  if(t.fabCanvas) { t.fabCanvas.selection = false; t.fabCanvas.defaultCursor = 'grab'; } 
              });
          }
          return;
      }

      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
          e.preventDefault(); 
          
          let nudgeAmount = e.key === 'ArrowLeft' ? -0.1 : 0.1;
          if (quantizeCheckbox && quantizeCheckbox.checked) {
              const gap = parseFloat(noteGapInput.value) || 0.25;
              nudgeAmount = e.key === 'ArrowLeft' ? -(gap/4) : (gap/4);
          }
          
          let nudged = false;
          tracks.forEach(track => {
              if (!track.fabCanvas) return;
              const activeObj = track.fabCanvas.getActiveObject();
              if (activeObj) {
                  if(!nudged) saveState();
                  
                  let deltaX = nudgeAmount * pixelsPerSecond;
                  let newLeft = activeObj.left + deltaX;
                  
                  if (newLeft < 0) {
                      newLeft = 0;
                      deltaX = 0 - activeObj.left;
                      nudgeAmount = deltaX / pixelsPerSecond;
                  }
                  
                  activeObj.set('left', newLeft);
                  activeObj.setCoords();
                  track.fabCanvas.requestRenderAll();
                  
                  let objs = activeObj.type === 'activeSelection' ? activeObj.getObjects() : [activeObj];
                  objs.forEach(obj => {
                      if (track.type === 'synth' && obj.drumIndex !== undefined) {
                          track.hits[obj.drumIndex].time += nudgeAmount;
                      } else if (track.type === 'melodic' && obj.melodicIndex !== undefined) {
                          track.hits[obj.melodicIndex].time += nudgeAmount;
                      } else if (track.type === 'audio') {
                          track.offset += nudgeAmount;
                      }
                  });
                  
                  if (track.type === 'synth' || track.type === 'melodic') track.hits.sort((a,b)=>a.time-b.time);
                  nudged = true;
              }
          });
          
          if (nudged) {
              let max = 5; 
              tracks.forEach(t => {
                  if (t.type === 'audio') max = Math.max(max, t.offset + t.buffer.duration);
                  if (t.type === 'synth' && t.hits.length > 0) t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
                  if (t.type === 'melodic' && t.hits.length > 0) t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
              });
              if (max + 1 > longestDuration) {
                  longestDuration = max + 1;
                  drawRuler();
                  document.querySelectorAll('.track-canvas-container').forEach(c => {
                     c.style.width = getTimelineWidth() + 'px';
                  });
                  tracks.forEach(t => t.fabCanvas.setWidth(getTimelineWidth()));
              }
          }
      } else if (isCmdOrCtrl && key === 'z') { 
        e.preventDefault(); 
        if (e.shiftKey) redo(); else undo(); 
      } else if (isCmdOrCtrl && key === 'c') {
        e.preventDefault(); copySelection();
      } else if (isCmdOrCtrl && key === 'v') {
        e.preventDefault(); pasteSelection();
      } else if (e.key === 'Backspace' || e.key === 'Delete') {
        deleteSelection();
      }
    });

    document.addEventListener('keyup', (e) => {
        if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
        
        if (e.key === 'Alt') {
            if (!isSpaceDown) {
                document.body.style.cursor = 'default';
                tracks.forEach(t => { 
                    if(t.fabCanvas) { t.fabCanvas.selection = true; t.fabCanvas.defaultCursor = 'default'; } 
                });
            }
            return;
        }
        
        if (e.code === 'Space') {
            e.preventDefault();
            isSpaceDown = false;
            
            if (!e.altKey) {
                document.body.style.cursor = 'default';
                tracks.forEach(t => { 
                    if(t.fabCanvas) { t.fabCanvas.selection = true; t.fabCanvas.defaultCursor = 'default'; } 
                });
            }
            
            if (!hasDraggedDuringSpace) {
                if (isPlaying) stopBtn.click(); else playBtn.click();
            }
            hasDraggedDuringSpace = false;
            return;
        }
    });

    function configureSelection(e) {
      if (e.target && e.target.type === 'activeSelection') {
          e.target.set({ lockMovementY: true, lockScalingY: true, transparentCorners: false, cornerColor: '#00ffcc', borderColor: '#00ffcc', cornerSize: 10 });
          e.target.setControlsVisibility({ mt: false, mb: false, ml: true, mr: true, tr: false, tl: false, br: false, bl: false, mtr: false });
      }
    }

    rulerCanvasContainer.addEventListener('mousedown', (e) => {
      if (isPlaying) stopBtn.click();
      const rect = rulerCanvasContainer.getBoundingClientRect();

      let newTime = newX / pixelsPerSecond;
      if (newTime > longestDuration) newTime = longestDuration;
      pausedAt = newTime;
      playhead.style.left = (HEADER_WIDTH + (pausedAt * pixelsPerSecond)) + 'px';
      isDraggingPlayhead = true;
    });

          <div class="track-control-row"><span>PAN</span><input type="range" min="-1" max="1" step="0.01" value="${track.panNode.pan.value}" class="track-pan-slider" title="L/R Panning"></div>
          <div class="track-control-row"><span>LPF</span><input type="range" min="100" max="20000" step="100" value="${track.eqNode.frequency.value}" class="track-eq-slider" title="Filter Cutoff"></div>

      const canvasElement = trackWrapper.querySelector('.fab-canvas');
      track.fabCanvas = new fabric.Canvas(canvasElement, { selection: true, width: getTimelineWidth(), height: 125 });
      if (track.type === 'audio') track.hiddenCanvas = trackWrapper.querySelector('.hidden-canvas');
      track.color = color;

      const patchSelect = trackWrapper.querySelector('.track-patch-select');
      if (patchSelect) {
          patchSelect.addEventListener('change', (e) => {

      trackWrapper.querySelector('.move-down-btn').addEventListener('click', () => {
          const next = trackWrapper.nextElementSibling;

              tracks = tracks.filter(t => t.id !== track.id);
              if (activeMelodicTrack && activeMelodicTrack.id === track.id) activeMelodicTrack = null;
              for (let key in activeSynthTracks) {
                  if (activeSynthTracks[key] && activeSynthTracks[key].id === track.id) activeSynthTracks[key] = null;
              }
              recalculateDuration();
          }
      });

      track.fabCanvas.on('selection:created', configureSelection);
      track.fabCanvas.on('selection:updated', configureSelection);

      track.fabCanvas.on('mouse:down', function(opt) {
        if (opt.target) {
            saveState();
            
            // --- NEW RAZOR TOOL LOGIC ---
            if (isRazorToolActive && track.type === 'audio') {
                const origObj = opt.target;
                const pointer = track.fabCanvas.getPointer(opt.e);
                
                // Calculate where the blade struck relative to the clip's left edge
                const cutX = pointer.x - origObj.left;
                
                // Prevent cutting tiny slivers at the very edges
                if (cutX > 5 && cutX < (origObj.width * origObj.scaleX) - 5) {
                    
                    origObj.clone(function(clonedObj) {
                        const origCropX = origObj.cropX || 0;
                        
                        // 1. Shrink the original object (The Left Piece)
                        origObj.set({
                            width: cutX / origObj.scaleX
                        });
                        
                        // 2. Adjust and crop the cloned object (The Right Piece)
                        clonedObj.set({
                            left: origObj.left + cutX,
                            cropX: origCropX + (cutX / origObj.scaleX), 
                            width: ((origObj.width * origObj.scaleX) - cutX) / clonedObj.scaleX,
                        });
                        
                        track.fabCanvas.add(clonedObj);
                        track.fabCanvas.requestRenderAll();
                    });
                }
                return; // Exit so we don't trigger standard dragging
            }
        }
      });

      track.fabCanvas.on('object:modified', function(e) {
          let wasPlaying = isPlaying; if (wasPlaying) stopBtn.click();
          saveState();
          
          const obj = e.target;
          if (obj.type === 'activeSelection') {
              let children = obj.getObjects();
              track.fabCanvas.discardActiveObject(); 
              children.forEach(child => {
                  let newTime = child.left / pixelsPerSecond;
                  if (newTime < 0) newTime = 0;
                  
                  let newDur = (child.width * child.scaleX) / pixelsPerSecond;

                  if (track.type === 'synth') {
                      track.hits[child.drumIndex].time = newTime;
                      track.hits[child.drumIndex].duration = Math.max(0.1, newDur);
                  }
                  else if (track.type === 'melodic') {
                      track.hits[child.melodicIndex].time = newTime;
                      track.hits[child.melodicIndex].duration = Math.max(0.1, newDur);
                  }
              });
          } else {
              let newTime = obj.left / pixelsPerSecond;
              if (newTime < 0) newTime = 0;
              if (track.type === 'synth') {
                  track.hits[obj.drumIndex].time = newTime;
                  if (obj.scaleX !== 1) {
                      let newDuration = (obj.width * obj.scaleX) / pixelsPerSecond;
                      track.hits[obj.drumIndex].duration = Math.max(0.1, newDuration);
                  }
              }
              else if (track.type === 'melodic') {
                  track.hits[obj.melodicIndex].time = newTime;
                  if (obj.scaleX !== 1) {
                      let newDuration = (obj.width * obj.scaleX) / pixelsPerSecond;
                      track.hits[obj.melodicIndex].duration = Math.max(0.1, newDuration);
                  }
              }
              else if (track.type === 'audio') track.offset = newTime;
          }
          
          if (track.type === 'synth') track.hits.sort((a,b)=>a.time-b.time);
          if (track.type === 'melodic') track.hits.sort((a,b)=>a.time-b.time);
          
          let max = 5; 
          tracks.forEach(t => {
              if (t.type === 'audio') max = Math.max(max, t.offset + t.buffer.duration);
              if (t.type === 'synth' && t.hits.length > 0) t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
              if (t.type === 'melodic' && t.hits.length > 0) t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
          });
          if (max + 1 > longestDuration) {
              longestDuration = max + 1;
              drawRuler();
              document.querySelectorAll('.track-canvas-container').forEach(c => { c.style.width = getTimelineWidth() + 'px'; });
              tracks.forEach(t => t.fabCanvas.setWidth(getTimelineWidth()));
          }
          if (wasPlaying) playBtn.click();
      });

      track.fabCanvas.on('mouse:dblclick', function(opt) {
        if (opt.target && track.type === 'melodic') {
            if (replacingNote && replacingNote.obj === opt.target) {
                opt.target.set('strokeWidth', 1);
                opt.target.set('stroke', '#000');
                track.fabCanvas.requestRenderAll();
                replacingNote = null;
                return;
            }
            if (replacingNote) {
                replacingNote.obj.set('strokeWidth', 1);
                replacingNote.obj.set('stroke', '#000');
                if (replacingNote.track.fabCanvas) replacingNote.track.fabCanvas.requestRenderAll();
            }
            opt.target.set('strokeWidth', 3);
            opt.target.set('stroke', '#ff0000');
            track.fabCanvas.requestRenderAll();
            replacingNote = { track: track, obj: opt.target, index: opt.target.melodicIndex };
            return;
        }
        if (opt.target) return; 
        
        if (isPlaying) stopBtn.click();
        const workspaceRect = timelineUI.getBoundingClientRect();
        let newX = (opt.e.clientX - workspaceRect.left) - HEADER_WIDTH;
        if (newX < 0) newX = 0;
        let newTime = newX / pixelsPerSecond;
        if (newTime > longestDuration) newTime = longestDuration;
        pausedAt = newTime;
        playhead.style.left = (HEADER_WIDTH + (pausedAt * pixelsPerSecond)) + 'px';

      trackWrapper.querySelector('.track-vol-slider').addEventListener('input', (e) => track.gainNode.gain.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05));
      trackWrapper.querySelector('.track-pan-slider').addEventListener('input', (e) => track.panNode.pan.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05));
      trackWrapper.querySelector('.track-eq-slider').addEventListener('input', (e) => track.eqNode.frequency.setTargetAtTime(parseFloat(e.target.value), audioCtx.currentTime, 0.05));
    }

    function drawRuler() {
      if (tracks.length === 0) return;
      const rCanvas = document.getElementById('rulerCanvas'), rWidth = getTimelineWidth();
      rCanvas.width = rWidth; const ctx = rCanvas.getContext('2d');
      ctx.clearRect(0,0, rWidth, 30); ctx.fillStyle = '#888'; ctx.font = '10px sans-serif';
      
      let subDiv = 1;
      if (pixelsPerSecond >= 150) subDiv = 0.1;
      else if (pixelsPerSecond >= 80) subDiv = 0.25;
      else if (pixelsPerSecond >= 40) subDiv = 0.5;

      const numSteps = Math.ceil((longestDuration + 5) / subDiv);
      
      for(let i=0; i<=numSteps; i++) {
        const x = i * subDiv * pixelsPerSecond;
        const isMajor = Math.abs((i * subDiv) - Math.round(i * subDiv)) < 0.01;
        if (isMajor) {
            ctx.fillRect(x, 15, 1, 15); 
            ctx.fillText(Math.round(i * subDiv) + 's', x + 3, 12);
        } else {
            ctx.fillRect(x, 22, 1, 8);
        }
      }
      
      const bgSize = (subDiv * pixelsPerSecond) + 'px 100%';
      const bgImage = 'linear-gradient(to right, rgba(255,255,255,0.07) 1px, transparent 1px)';
      document.querySelectorAll('.track-canvas-container').forEach(c => {
         c.style.width = rWidth + 'px';
         c.style.backgroundImage = bgImage;
         c.style.backgroundSize = bgSize;
         c.style.backgroundPosition = '0 0';
      });
      tracks.forEach(t => t.fabCanvas.setWidth(rWidth));
    }

    function recalculateDuration() {
      let max = 5; 
      if (isRecording && isPlaying) {
          max = Math.max(max, (audioCtx.currentTime - startedAt));
      }
      tracks.forEach(t => {
        if (t.type === 'audio') max = Math.max(max, t.offset + t.buffer.duration);
        if (t.type === 'synth' && t.hits.length > 0) {
            t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
        }
        if (t.type === 'melodic' && t.hits.length > 0) {
            t.hits.forEach(h => { let end = h.time + (h.duration || 0.25); if (end > max) max = end; });
        }
      });
      longestDuration = max + 1; drawRuler(); redrawAllTimelines();
    }

    function redrawAllTimelines() { tracks.forEach(t => { 
      if (t.type === 'audio') drawWaveform(t); 
      if (t.type === 'synth') drawDrumTrack(t); 
      if (t.type === 'melodic') drawMelodicTrack(t);
    }); }

    function drawMelodicTrack(track) {
      track.fabCanvas.clear();
      track.hits.forEach((hit, index) => {
        const xPos = hit.time * pixelsPerSecond;
        const dur = hit.duration || 0.25;
        const noteWidth = dur * pixelsPerSecond;
        const hitGroup = new fabric.Group([
          new fabric.Rect({ left: 0, top: 0, width: noteWidth, height: 110, fill: track.color, stroke: '#000', strokeWidth: 1 }),
          new fabric.Text(hit.name, { left: 4, top: 40, fontSize: 10, fill: '#000', fontWeight: 'bold' })
        ], { 
          left: xPos, top: 5, hasControls: true, hasBorders: true, lockMovementY: true, 
          hoverCursor: 'ew-resize', moveCursor: 'grabbing', selectable: true 
        });
        
        if (replacingNote && replacingNote.track.id === track.id && replacingNote.index === index) {
            hitGroup.set('strokeWidth', 3);
            hitGroup.set('stroke', '#ff0000');
            replacingNote.obj = hitGroup; 
        }

        hitGroup.melodicIndex = index;
        hitGroup.setControlsVisibility({ mt: false, mb: false, ml: false, mr: true, tr: false, tl: false, br: false, bl: false, mtr: false });
        track.fabCanvas.add(hitGroup);
      });
      track.fabCanvas.requestRenderAll();
    }

    function drawWaveform(track) {
      track.fabCanvas.clear();
      const drawWidth = track.buffer.duration * pixelsPerSecond;
      const hCanvas = track.hiddenCanvas; hCanvas.width = drawWidth; hCanvas.height = 100;
      const ctx = hCanvas.getContext('2d'); ctx.clearRect(0, 0, drawWidth, 100);
      const rawData = track.buffer.getChannelData(0), step = Math.ceil(rawData.length / drawWidth), amp = 50; 
      ctx.fillStyle = track.color;
      for (let i = 0; i < drawWidth; i++) {
        let min = 1.0, max = -1.0;
        for (let j = 0; j < step; j++) {
          const idx = (i * step) + j;
          if (idx < rawData.length) { const datum = rawData[idx]; if (datum < min) min = datum; if (datum > max) max = datum; }
        }
        ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
      }
      fabric.Image.fromURL(hCanvas.toDataURL(), function(img) {
        img.set({ left: track.offset * pixelsPerSecond, top: 5, hasControls: false, hasBorders: true, lockMovementY: true, hoverCursor: 'grab', moveCursor: 'grabbing', selectable: true });
        track.fabCanvas.add(img);
        track.fabCanvas.requestRenderAll();
      });
    }

    function drawDrumTrack(track) {
      track.fabCanvas.clear();
      track.hits.forEach((hit, index) => {
        const xPos = hit.time * pixelsPerSecond;
        const dur = hit.duration || 0.25;
        const noteWidth = dur * pixelsPerSecond;
        const hitRect = new fabric.Rect({ 
          left: xPos, top: 5, width: noteWidth, height: 110, 
          fill: track.color, hasControls: true, hasBorders: true, lockMovementY: true, 
          hoverCursor: 'ew-resize', moveCursor: 'grabbing', selectable: true 
        });
        hitRect.drumIndex = index;
        hitRect.setControlsVisibility({ mt: false, mb: false, ml: false, mr: true, tr: false, tl: false, br: false, bl: false, mtr: false });
        track.fabCanvas.add(hitRect);
      });
      track.fabCanvas.requestRenderAll();
    }

    playhead.addEventListener('mousedown', (e) => { isDraggingPlayhead = true; if (isPlaying) stopBtn.click(); e.stopPropagation(); });
    window.addEventListener('mousemove', (e) => {
      if (!isDraggingPlayhead) return;
      const workspaceRect = timelineUI.getBoundingClientRect();
      let newX = (e.clientX - workspaceRect.left) - HEADER_WIDTH;
      if (newX < 0) newX = 0;
      let newTime = newX / pixelsPerSecond;
      if (newTime > longestDuration) newTime = longestDuration;
      pausedAt = newTime;
      playhead.style.left = (HEADER_WIDTH + newX) + 'px';
    });
    window.addEventListener('mouseup', () => { if (isDraggingPlayhead) isDraggingPlayhead = false; });
    zoomInBtn.addEventListener('click', () => { pixelsPerSecond += 25; recalculateDuration(); });
    zoomOutBtn.addEventListener('click', () => { pixelsPerSecond = Math.max(25, pixelsPerSecond - 25); recalculateDuration(); });

    async function decodeUploadedFile(file) { const arrayBuffer = await file.arrayBuffer(); return await audioCtx.decodeAudioData(arrayBuffer); }

    irInput.addEventListener('change', async () => {
      initAudioEngineSync();
      if (irInput.files.length > 0) { convolver.buffer = await decodeUploadedFile(irInput.files[0]); irInput.value = ""; }
    });

    trackInput.addEventListener('change', async () => {
      initAudioEngineSync();
      for (let file of trackInput.files) {
        const buffer = await decodeUploadedFile(file);
        saveState();
        const nodes = createChannelStripNodes();
        const newTrack = { id: Math.random().toString(36).substr(2, 9), type: 'audio', buffer: buffer, inputNode: nodes.inputNode, eqNode: nodes.eqNode, panNode: nodes.panNode, gainNode: nodes.gainNode, source: null, name: file.name, offset: 0 };
        tracks.push(newTrack); createTrackUI(newTrack, colors[tracks.length % colors.length]);
      }
      recalculateDuration(); trackInput.value = "";
    });

    saveBtn.addEventListener('click', () => {
      if (tracks.length === 0) return alert("Nothing to save!");
      const projectData = {
        master: { vol: volumeSlider.value, mix: mixSlider.value },
        tracks: tracks.map(t => {
          const baseData = { id: t.id, type: t.type, name: t.name, color: t.color, vol: t.gainNode.gain.value, pan: t.panNode.pan.value, eq: t.eqNode.frequency.value };
          if (t.type === 'audio') return { ...baseData, offset: t.offset };

    async function encodeMp3(buffer) {
        return new Promise((resolve) => {
            const channels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const kbps = 192; 
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, kbps);
            const mp3Data = [];

            const left = buffer.getChannelData(0);
            const right = channels > 1 ? buffer.getChannelData(1) : left;
            const sampleBlockSize = 1152;
            
            const leftInt16 = new Int16Array(left.length);
            const rightInt16 = new Int16Array(right.length);
            
            for (let i = 0; i < left.length; i++) {
                leftInt16[i] = left[i] < 0 ? left[i] * 32768 : left[i] * 32767;
                rightInt16[i] = right[i] < 0 ? right[i] * 32768 : right[i] * 32767;
            }

            for (let i = 0; i < left.length; i += sampleBlockSize) {
                const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
                const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
                const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
                if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
            }
            
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(new Int8Array(mp3buf));
            
            resolve(new Blob(mp3Data, { type: 'audio/mp3' }));
        });
    }

        if (track.type === 'audio') { const source = offlineCtx.createBufferSource(); source.buffer = track.buffer; source.connect(offTrackEQ); source.start(track.offset); } 
        else if (track.type === 'synth') { track.hits.forEach(hit => { triggerSynth(offlineCtx, track.instrument, hit.time, offTrackEQ, null, hit.duration || 0.25, hVal, aVal); }); }
        else if (track.type === 'melodic') { track.hits.forEach(hit => { triggerMelody(offlineCtx, hit.time, hit.freq, offTrackEQ, track, hit.duration || 0.25, hVal, aVal); }); }
      });
      
      const renderedBuffer = await offlineCtx.startRendering();
      const exportFormat = exportFormatSelect.value;
      const anchor = document.createElement('a');
      
      if (exportFormat === 'mp3') {
          exportBtn.textContent = "Encoding MP3...";
          const mp3Blob = await encodeMp3(renderedBuffer);
          anchor.href = window.URL.createObjectURL(mp3Blob); 
          anchor.download = 'My_DAW_Mix.mp3';
      } else {
          const wavData = audioBufferToWav(renderedBuffer);
          const blob = new window.Blob([new DataView(wavData)], { type: 'audio/wav' });
          anchor.href = window.URL.createObjectURL(blob); 
          anchor.download = 'My_DAW_Mix.wav';
      }
      
      anchor.click(); 
      exportBtn.textContent = "⬇ Export"; 
      exportBtn.disabled = false;
    });

    function audioBufferToWav(buffer) {
      const numOfChan = buffer.numberOfChannels, length = buffer.length * numOfChan * 2 + 44, outBuffer = new ArrayBuffer(length), view = new DataView(outBuffer);
      const channels = []; let i, sample, offset = 0, pos = 0;
      function setUint16(data) { view.setUint16(pos, data, true); pos += 2; } function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
      setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(buffer.sampleRate); setUint32(buffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);                   
      for (i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));
      while (pos < length) {
        for (i = 0; i < numOfChan; i++) { sample = Math.max(-1, Math.min(1, channels[i][offset])); sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0; view.setInt16(pos, sample, true); pos += 2; } offset++;
      } return outBuffer;
    }
