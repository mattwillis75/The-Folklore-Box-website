<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product | The Folklore Box</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;600&family=Spectral:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base Colors & Typography */
        :root {
            --bg-color: #000000;
            --secondary-bg: #0a0a0a;
            --border-color: #333333;
            --text-light: #ffffff;
            --text-muted: #aaaaaa;
            --accent-red: #cc0000;
            --font-headings: 'Spectral', serif;
            --font-body: 'Lato', sans-serif;
            --transition-speed: 0.3s;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Navigation - Restored to the sticky blurred design */
        header {
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 500;
        }
        
        header h1 {
            font-family: var(--font-headings);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .back-btn, .cart-toggle-btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 300; /* Lighter weight */
            letter-spacing: 1px;
            border-radius: 3px;
            transition: border-color var(--transition-speed);
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover, .cart-toggle-btn:hover {
            border-color: var(--accent-red);
        }

        header nav { display: flex; gap: 15px; }

        /* Product Layout */
        .container {
            max-width: 1100px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            min-height: 500px;
        }

        @media (max-width: 800px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Image Gallery - Restored 4:3 Ratio */
        .gallery-main {
            width: 100%;
            aspect-ratio: 4 / 3;
            height: auto;
            background: #111;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-thumbs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }

        .gallery-thumbs img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            cursor: pointer;
            transition: border-color var(--transition-speed);
        }

        .gallery-thumbs img:hover, .gallery-thumbs img.active {
            border-color: var(--accent-red);
        }

        /* Product Details */
        .product-details {
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-family: var(--font-headings);
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            line-height: 1.2;
        }

        .product-price {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin: 0 0 30px 0;
        }

        .product-description {
            font-size: 1.1rem;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .meta-list {
            list-style: none;
            padding: 0;
            margin: 0 0 30px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        .meta-list li {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }
        .meta-list li strong { color: var(--text-light); }

        /* Form / Add to Cart */
        .variant-select {
            margin-bottom: 25px;
        }

        .variant-select label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .variant-select select {
            width: 100%;
            padding: 15px;
            background: #111;
            color: #fff;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            outline: none;
            font-family: var(--font-body);
            font-size: 1rem;
            cursor: pointer;
        }
        
        .variant-select select:focus { border-color: var(--accent-red); }

        .add-cart-btn {
            width: 100%;
            padding: 18px;
            background: var(--accent-red);
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 300; /* Lighter weight */
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            transition: background var(--transition-speed);
        }

        .add-cart-btn:hover:not(:disabled) { background: #e60000; }
        .add-cart-btn:disabled { background: #333; color: #777; cursor: not-allowed; }

        /* Smart Cart Side Panel */
        .cart-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 1000; opacity: 0; visibility: hidden; transition: opacity 0.3s; }
        .cart-panel { position: fixed; top: 0; right: -400px; width: 100%; max-width: 400px; height: 100vh; background: var(--secondary-bg); border-left: 1px solid var(--border-color); z-index: 1001; transition: right 0.3s ease; display: flex; flex-direction: column; }
        .cart-overlay.active { opacity: 1; visibility: visible; }
        .cart-panel.active { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h2 { margin: 0; font-family: var(--font-headings); }
        .close-cart-btn { background: none; border: none; color: var(--text-light); font-size: 1.5rem; cursor: pointer; }
        .cart-items-container { flex-grow: 1; padding: 20px; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); }
        .cart-item-details { flex-grow: 1; }
        .cart-item-title { margin: 0 0 5px 0; font-weight: 600; }
        .cart-item-meta { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 5px 0; }
        .cart-qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: #222; border: none; color: #fff; width: 25px; height: 25px; cursor: pointer; border-radius: 3px; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border-color); background: var(--bg-color); }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 600; margin-bottom: 20px; }
        .checkout-btn { width: 100%; padding: 15px; background: var(--accent-red); color: #fff; border: none; border-radius: 3px; text-transform: uppercase; font-weight: 300; /* Lighter weight */ letter-spacing: 1px; cursor: pointer; font-size: 1rem; }

        /* Custom Stock Alert Modal */
        .stock-alert-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .stock-alert-box { background: #0a0a0a; border: 1px solid var(--accent-red); padding: 2.5rem; border-radius: 4px; max-width: 400px; width: 90%; text-align: center; color: #fff; box-shadow: 0 10px 30px rgba(204,0,0,0.15); }
        .stock-alert-box p { margin-bottom: 2rem; font-size: 1.1rem; }
        .stock-alert-btn { background: var(--accent-red); color: #fff; border: none; padding: 1rem 2rem; text-transform: uppercase; font-weight: 300; letter-spacing: 1px; cursor: pointer; border-radius: 3px; transition: background 0.3s ease; width: 100%; }
        .stock-alert-btn:hover { background: #e60000; }
    </style>
</head>
<body>

    <header>
        <h1>The Folklore Box</h1>
        <nav>
            <a href="shop.html" class="back-btn">&larr; Back to Shop</a>
            <button class="cart-toggle-btn" onclick="openCart()">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <div class="container" id="product-container">
        <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
            <h2>Loading product...</h2>
        </div>
    </div>

    <!-- Smart Cart Panel -->
    <div class="cart-overlay" id="cart-overlay" onclick="closeCart()"></div>
    <div class="cart-panel" id="cart-panel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart-btn" onclick="closeCart()">&times;</button>
        </div>
        <div class="cart-items-container" id="cart-items">
            <!-- Cart items injected here -->
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Subtotal</span>
                <span id="cart-subtotal">£0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Custom Stock Alert Modal -->
    <div id="stock-alert" class="stock-alert-overlay">
        <div class="stock-alert-box">
            <h2 style="margin-top: 0; color: var(--accent-red);">Stock Limit Reached</h2>
            <p id="stock-alert-msg"></p>
            <button class="stock-alert-btn" onclick="document.getElementById('stock-alert').style.display='none'">Understood</button>
        </div>
    </div>

    <script>
        // Extract Product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        
        let allProducts = [];
        let currentProduct = null;
        
        const cartKey = 'folklore_cart';
        let cart = JSON.parse(localStorage.getItem(cartKey)) || [];

        // CACHE BUSTER ADDED HERE
        fetch('products.txt?v=' + new Date().getTime(), { cache: 'no-store' })
            .then(response => response.text())
            .then(text => {
                try {
                    const blocks = text.split(/---\r?\n/);
                    blocks.forEach(block => {
                        if (block.trim() === '') return;
                        const lines = block.split('\n');
                        
                        let product = { 
                            basePrice: 0, sections: '', 
                            size: '', materials: '', images: '',
                            stock: 10, stockS: 10, stockM: 10, stockL: 10, stockXL: 10, stockXXL: 10 
                        }; 
                        
                        let isParsingDesc = false;

                        lines.forEach(line => {
                            if (!isParsingDesc) {
                                const colonIdx = line.indexOf(':');
                                if (colonIdx > -1) {
                                    const key = line.substring(0, colonIdx).trim().toLowerCase();
                                    const value = line.substring(colonIdx + 1).trim();
                                    
                                    if (key === 'title') product.title = value;
                                    else if (key === 'main image') product.mainImage = value;
                                    else if (key === 'images') product.images = value;
                                    else if (key === 'sections') product.sections = value;
                                    else if (key === 'size') product.size = value;
                                    else if (key === 'materials') product.materials = value;
                                    else if (key === 'postal class') product.postalClass = value;
                                    else if (key === 'item cost') product.basePrice = parseFloat(value.replace(/[^0-9.]/g, '')) || 0;
                                    
                                    // Stock parsing
                                    else if (key === 'stock') product.stock = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    else if (key === 'stock s') product.stockS = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    else if (key === 'stock m') product.stockM = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    else if (key === 'stock l') product.stockL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    else if (key === 'stock xl') product.stockXL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    else if (key === 'stock xxl') product.stockXXL = isNaN(parseInt(value)) ? 10 : parseInt(value);
                                    
                                    else if (key === 'description') {
                                        isParsingDesc = true;
                                        product.description = value ? value + "\n" : "";
                                    }
                                }
                            } else {
                                product.description += line + "\n";
                            }
                        });
                        
                        if(product.description) product.description = product.description.trim();
                        
                        // Generate rock-solid unique ID based on the Title 
                        if (product.title) {
                            product.id = 'prod-' + product.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                            allProducts.push(product);
                        }
                    });
                    
                    currentProduct = allProducts.find(p => p.id === productId);
                    
                    if (currentProduct) {
                        renderProduct();
                    } else {
                        document.getElementById('product-container').innerHTML = `
                            <div style="grid-column: 1 / -1; text-align: center; padding: 50px;">
                                <h2 style="margin-bottom: 20px;">Product not found.</h2>
                                <p style="color: var(--text-muted); font-size: 1.1rem; margin-bottom: 40px;">It may have been removed or the link is incorrect.</p>
                                <a href="shop.html" class="back-btn" style="padding: 15px 30px; border-color: #555;">Return to Shop</a>
                            </div>`;
                    }
                    
                    updateCartUI();

                } catch (err) {
                    console.error("Error processing products:", err);
                    document.getElementById('product-container').innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--delete-red);">
                            <h2>Error loading product</h2>
                            <p>${err.message}</p>
                        </div>`;
                }
            })
            .catch(err => {
                console.error("Fetch error:", err);
                document.getElementById('product-container').innerHTML = "<div style='grid-column: 1 / -1; text-align: center;'><h2>Error communicating with database.</h2></div>";
            });

        // 2. Render Product UI
        function renderProduct() {
            let galleryImages = [];
            if(currentProduct.mainImage) galleryImages.push(currentProduct.mainImage);
            if(currentProduct.images) {
                const extras = currentProduct.images.split(',').map(img => img.trim()).filter(Boolean);
                galleryImages = galleryImages.concat(extras);
            }
            if(galleryImages.length === 0) galleryImages.push('placeholder.jpg');

            let thumbsHtml = '';
            if(galleryImages.length > 1) {
                galleryImages.forEach((img, i) => {
                    const activeClass = i === 0 ? 'active' : '';
                    thumbsHtml += `<img src="${img}" class="${activeClass}" onclick="swapImage(this, '${img}')" alt="Thumbnail">`;
                });
            }

            let metaHtml = '';
            if (currentProduct.size || currentProduct.materials) {
                metaHtml = `<ul class="meta-list">`;
                if (currentProduct.size) metaHtml += `<li><strong>Size:</strong> ${currentProduct.size}</li>`;
                if (currentProduct.materials) metaHtml += `<li><strong>Materials:</strong> ${currentProduct.materials}</li>`;
                metaHtml += `</ul>`;
            }

            const isTshirt = currentProduct.sections && currentProduct.sections.toLowerCase().includes('t-shirts');
            let formHtml = '';

            if (isTshirt) {
                formHtml = `
                    <div class="variant-select">
                        <label for="tshirt-size">Select Size <span style="color:var(--accent-red)">*</span></label>
                        <select id="tshirt-size" onchange="document.getElementById('size-error').style.display='none'">
                            <option value="">-- Choose a size --</option>
                            <option value="S" ${currentProduct.stockS <= 0 ? 'disabled style="color:#555;"' : ''}>Small ${currentProduct.stockS <= 0 ? '(Out of Stock)' : ''}</option>
                            <option value="M" ${currentProduct.stockM <= 0 ? 'disabled style="color:#555;"' : ''}>Medium ${currentProduct.stockM <= 0 ? '(Out of Stock)' : ''}</option>
                            <option value="L" ${currentProduct.stockL <= 0 ? 'disabled style="color:#555;"' : ''}>Large ${currentProduct.stockL <= 0 ? '(Out of Stock)' : ''}</option>
                            <option value="XL" ${currentProduct.stockXL <= 0 ? 'disabled style="color:#555;"' : ''}>X-Large ${currentProduct.stockXL <= 0 ? '(Out of Stock)' : ''}</option>
                            <option value="XXL" ${currentProduct.stockXXL <= 0 ? 'disabled style="color:#555;"' : ''}>XX-Large ${currentProduct.stockXXL <= 0 ? '(Out of Stock)' : ''}</option>
                        </select>
                        <div id="size-error" style="color:var(--accent-red); font-size:0.85rem; margin-top:0.5rem; display:none;">Please select a size before adding to cart.</div>
                    </div>
                    <button class="add-cart-btn" onclick="addToCartAction()">Add to Cart</button>
                `;
            } else {
                if (currentProduct.stock <= 0) {
                    formHtml = `<button class="add-cart-btn" disabled>Out of Stock</button>`;
                } else {
                    formHtml = `<button class="add-cart-btn" onclick="addToCartAction()">Add to Cart</button>`;
                }
            }

            document.getElementById('product-container').innerHTML = `
                <div>
                    <div class="gallery-main">
                        <img id="main-product-image" src="${galleryImages[0]}" alt="${currentProduct.title.replace(/"/g, '&quot;')}">
                    </div>
                    <div class="gallery-thumbs" id="gallery-thumbs">
                        ${thumbsHtml}
                    </div>
                </div>
                <div class="product-details">
                    <div>
                        <h1 class="product-title">${currentProduct.title}</h1>
                        <p class="product-price">£${currentProduct.basePrice.toFixed(2)}</p>
                        
                        <div class="product-description">${currentProduct.description || 'No description available.'}</div>
                        
                        ${metaHtml}
                    </div>
                    
                    <div style="margin-top: 20px;">
                        ${formHtml}
                    </div>
                </div>
            `;
        }

        // 3. UI Interactions
        window.swapImage = function(thumbElement, src) {
            document.getElementById('main-product-image').src = src;
            const thumbs = document.getElementById('gallery-thumbs').getElementsByTagName('img');
            for(let img of thumbs) { img.classList.remove('active'); }
            thumbElement.classList.add('active');
        };

        window.addToCartAction = function() {
            const isTshirt = currentProduct.sections && currentProduct.sections.toLowerCase().includes('t-shirts');
            let selectedSize = null;

            if (isTshirt) {
                const sizeSelect = document.getElementById('tshirt-size');
                selectedSize = sizeSelect.value;
                if (!selectedSize) {
                    document.getElementById('size-error').style.display = 'block';
                    return;
                }
            }
            
            addToSmartCart(currentProduct.id, currentProduct.title, currentProduct.basePrice, currentProduct.postalClass, selectedSize);
        };

        // 4. Cart Logic & Size-Specific Stock Validation
        window.addToSmartCart = function(id, title, price, postalClass, size = null) {
            const productData = allProducts.find(p => p.id === id);
            
            let maxStock = 10;
            if (productData) {
                if (size === 'S') maxStock = productData.stockS;
                else if (size === 'M') maxStock = productData.stockM;
                else if (size === 'L') maxStock = productData.stockL;
                else if (size === 'XL') maxStock = productData.stockXL;
                else if (size === 'XXL') maxStock = productData.stockXXL;
                else maxStock = productData.stock;
            }
            
            const cartItemId = size ? `${id}-${size}` : id;
            let existingItem = cart.find(item => (item.cartItemId || item.id) === cartItemId);
            let currentQty = existingItem ? existingItem.quantity : 0;

            if (currentQty + 1 > maxStock) {
                document.getElementById('stock-alert-msg').textContent = `Apologies. We only have ${maxStock} of this item in stock.`;
                document.getElementById('stock-alert').style.display = 'flex';
                return; 
            }

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, cartItemId, title, price, postalClass, size, quantity: 1 });
            }
            
            saveAndRefreshCart();
            openCart();
        };

        window.updateQuantity = function(index, delta) {
            if (delta > 0) {
                const item = cart[index];
                const productData = allProducts.find(p => p.id === item.id);
                
                let maxStock = 10;
                if (productData) {
                    if (item.size === 'S') maxStock = productData.stockS;
                    else if (item.size === 'M') maxStock = productData.stockM;
                    else if (item.size === 'L') maxStock = productData.stockL;
                    else if (item.size === 'XL') maxStock = productData.stockXL;
                    else if (item.size === 'XXL') maxStock = productData.stockXXL;
                    else maxStock = productData.stock;
                }
                
                if (item.quantity + delta > maxStock) {
                    document.getElementById('stock-alert-msg').textContent = `Apologies. We only have ${maxStock} of this item in stock.`;
                    document.getElementById('stock-alert').style.display = 'flex';
                    return;
                }
            }

            cart[index].quantity += delta;
            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            saveAndRefreshCart();
        };

        function saveAndRefreshCart() {
            localStorage.setItem(cartKey, JSON.stringify(cart));
            updateCartUI();
        }

        // 5. Cart UI Updates
        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const cartCountLabel = document.getElementById('cart-count');
            const cartSubtotalLabel = document.getElementById('cart-subtotal');
            
            cartContainer.innerHTML = '';
            let totalItems = 0;
            let subtotal = 0;

            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:40px;">Your cart is empty.</p>';
            } else {
                cart.forEach((item, index) => {
                    totalItems += item.quantity;
                    subtotal += item.price * item.quantity;
                    
                    const sizeLabel = item.size ? `<p class="cart-item-meta">Size: ${item.size}</p>` : '';
                    
                    cartContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <h4 class="cart-item-title">${item.title}</h4>
                                ${sizeLabel}
                                <p class="cart-item-meta">£${item.price.toFixed(2)}</p>
                            </div>
                            <div class="cart-qty-controls">
                                <button class="qty-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            cartCountLabel.innerText = totalItems;
            cartSubtotalLabel.innerText = `£${subtotal.toFixed(2)}`;
        }

        // 6. Side Panel Toggles
        window.openCart = function() {
            document.getElementById('cart-overlay').classList.add('active');
            document.getElementById('cart-panel').classList.add('active');
        };

        window.closeCart = function() {
            document.getElementById('cart-overlay').classList.remove('active');
            document.getElementById('cart-panel').classList.remove('active');
        };

        // 7. Checkout Stub 
        window.checkout = function() {
            if(cart.length === 0) return;
            alert('Proceeding to checkout...'); 
        };
    </script>
</body>
</html>
